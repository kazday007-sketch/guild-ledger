<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single-column dungeon table. Status ledger on top, the room of four cards in the middle, contract and log below. Deliberately dark, single theme. */
:root {
  color-scheme: dark;
  --stone: #12161d;      /* page ground */
  --slab: #1b212b;       /* panels */
  --slab-2: #242c38;     /* raised */
  --line: #333d4c;
  --bone: #e9e2d0;       /* card faces, primary text */
  --ash: #9aa3b2;        /* secondary text */
  --verdigris: #4fb7a0;  /* accent: guild seal */
  --blood: #d0545b;      /* potions, damage */
  --steel: #7aa6d8;      /* weapons */
  --ink: #1d1a17;        /* text on bone */
  --gold: #e0b450;
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "Spline Sans Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--stone); color: var(--bone); }
body { font: 16px/1.45 var(--body); margin: 0; padding-inline: 16px; padding-block: 16px 40px; }
main { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font: 400 30px/1 var(--display); margin: 0; letter-spacing: .02em; }
h2 { font: 400 20px/1.1 var(--display); margin: 0; letter-spacing: .03em; text-wrap: balance; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ash); }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--ash); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
button { font: 600 15px var(--body); color: var(--bone); background: var(--slab-2); border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--verdigris); }
button:focus-visible { outline: 2px solid var(--verdigris); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--verdigris); color: #08201b; border-color: var(--verdigris); }
.link { background: none; border: 0; padding: 0; color: var(--verdigris); text-decoration: underline; font-weight: 500; }

/* status ledger */
.status { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stat { background: var(--slab); padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.stat .num { font-size: 20px; font-weight: 700; }
.hpbar { height: 6px; background: var(--slab-2); border-radius: 3px; overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--blood); transition: width .3s; }
.pips { display: flex; gap: 5px; align-items: center; height: 26px; }
.pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.pip.on { background: var(--blood); border-color: var(--blood); }
.pip.room.on { background: var(--verdigris); border-color: var(--verdigris); }
@media (max-width: 620px) { .status { grid-template-columns: repeat(2, minmax(0, 1fr)); } .status .stat:first-child { grid-column: 1 / -1; } }

/* contract */
.contract { background: var(--slab); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
.contract-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.progress { height: 12px; background: var(--slab-2); border-radius: 6px; overflow: hidden; position: relative; }
.progress i { display: block; height: 100%; background: var(--verdigris); transition: width .3s; }
.progress.met i { background: var(--gold); }
.boss { border: 1px dashed var(--blood); border-radius: 8px; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.boss b { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--blood); }
.offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.offer.clause { border-style: dashed; border-color: var(--gold); }
.offer .cl { color: var(--gold); font-weight: 700; font-size: 14px; }
.cline { color: var(--gold); }
.offer { text-align: left; display: grid; gap: 4px; padding: 12px; }
.offer .tier { font: 400 18px var(--display); }
.offer .num { font-size: 18px; }


/* room */
.room { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .room { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { background: var(--bone); color: var(--ink); border-radius: 10px; padding: 10px; min-height: 168px; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; box-shadow: 0 2px 0 rgba(0,0,0,.4); animation: deal .25s ease-out; }
@keyframes deal { from { transform: translateY(-8px); opacity: .3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } .hpbar i, .progress i { transition: none; } }
.card .corner { display: flex; justify-content: space-between; align-items: baseline; }
.card .rank { font: 700 26px/1 var(--mono); }
.card .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
.card .face { font: 400 15px/1.2 var(--display); align-self: center; text-align: center; }
.card.monster .kind, .card.monster .rank { color: #2a2622; }
.card.monster { background: linear-gradient(#e9e2d0, #d9d0bb); }
.card.weapon .kind, .card.weapon .rank { color: #2e5f93; }
.card.potion .kind, .card.potion .rank { color: #a3323a; }
.card.elite { outline: 2px solid var(--gold); }
.card .acts { display: grid; gap: 6px; }
.card .acts button { background: var(--ink); color: var(--bone); border-color: var(--ink); padding: 7px 8px; font-size: 13px; text-align: left; }
.card .acts button:hover:not(:disabled) { border-color: var(--verdigris); }
.card.idle .acts button { visibility: hidden; }
.roombar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* relics, shop */
.relics { display: flex; flex-wrap: wrap; gap: 8px; }
.relic { background: var(--slab); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; flex: 1 1 200px; }
.relic b { font-family: var(--display); font-weight: 400; font-size: 16px; color: var(--verdigris); }
.relic .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.shop { display: grid; gap: 14px; background: var(--slab); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.shopgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .shopgrid { grid-template-columns: 1fr; } }
.ware { background: var(--slab-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; gap: 6px; align-content: start; }
.ware b { font-family: var(--display); font-weight: 400; font-size: 17px; }
.price { color: var(--gold); }

.log { background: var(--slab); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-height: 170px; overflow-y: auto; font-size: 14px; }
.log p { margin: 0; padding: 3px 0; border-bottom: 1px solid var(--slab-2); }
.log p:first-child { color: var(--bone); } .log p { color: var(--ash); }
.result { font-size: 17px; }
.end { text-align: center; display: grid; gap: 12px; padding: 30px 14px; background: var(--slab); border: 1px solid var(--line); border-radius: 8px; justify-items: center; }
.end h2 { font-size: 32px; }
details.rules { background: var(--slab); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
details.rules summary { cursor: pointer; font-weight: 700; }
details.rules ol { margin: 8px 0 4px; padding-left: 20px; display: grid; gap: 4px; }
.peek { font-size: 14px; }
.coach { border: 1px solid var(--verdigris); background: color-mix(in srgb, var(--verdigris) 12%, var(--slab)); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; justify-items: start; }
.coach p { margin: 0; max-width: 65ch; }
.coach.hint { border-color: var(--line); background: var(--slab); }
.warn { margin: 0; padding: 8px 12px; border-radius: 6px; background: var(--slab); border: 1px solid var(--line); }
.warn.short { border-color: var(--blood); }
.goal { margin: 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--verdigris); background: color-mix(in srgb, var(--verdigris) 10%, var(--slab)); font-size: 16px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.goal .label { color: var(--verdigris); }
.goal.done { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, var(--slab)); }
.goal.done .label { color: var(--gold); }
.why { text-align: left; max-width: 520px; margin: 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--slab-2); display: grid; gap: 6px; }
.why p { margin: 0; }
.card.lit { outline: 3px solid var(--verdigris); outline-offset: 2px; }
.offer.lit { border-color: var(--verdigris); }
.sync { font-size: 13px; text-align: center; margin: 4px 0 0; }
.version { font-size: 11px; text-align: center; margin: 6px 0 0; opacity: .6; }
.fb { font-weight: 500; }
textarea, input#pname { width: 100%; max-width: 480px; font: 15px var(--body); color: var(--bone); background: var(--slab-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
textarea:focus-visible, input#pname:focus-visible { outline: 2px solid var(--verdigris); }
.recap { text-align: left; max-width: 520px; margin: 0; padding-left: 20px; display: grid; gap: 6px; }
#statsbody p { margin: 6px 0; }

/* ---------- art (assets/ is built by src/import_art.py) ---------- */
:root {
  --panel-bg: linear-gradient(rgba(27,33,43,.9), rgba(27,33,43,.9)), url(assets/ui/texture-slate.webp) 0 0 / 256px;
  --paper-ink: #2b241c; --paper-muted: #5e5345; --paper-gold: #8a5f0c; --paper-red: #8e2d26;
}
html { background: var(--stone); }
body { background: transparent; }
#scene { position: fixed; inset: 0; z-index: 0; background: var(--stone) center / cover no-repeat; }
#scene::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,17,23,.5), rgba(14,17,23,.8) 45%, rgba(14,17,23,.9)); }
#scene.dim::after { background: linear-gradient(180deg, rgba(10,12,16,.74), rgba(10,12,16,.92) 45%); }
main { position: relative; z-index: 1; }
.stat, .shop, .log, details.rules, .end, .relic, .warn:not(.lh), .coach.hint, .contract.board { background: var(--panel-bg); }
h1 { display: flex; align-items: center; gap: 10px; }
header { align-items: center; }
h1 .emblem { width: 44px; height: 44px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
.stat .label { display: flex; align-items: center; gap: 6px; }
.stat .label img, .ico-sm { width: 22px; height: 22px; flex: none; }
.bi { width: 20px; height: 20px; vertical-align: -5px; margin-right: 6px; }
button.primary { background: #c9a24a url(assets/ui/texture-brass.webp) center / cover; color: #2a1d05; border-color: #7d5f1c; text-shadow: 0 1px 0 rgba(255,240,200,.35); }
button.primary:hover:not(:disabled) { border-color: #f1d488; filter: brightness(1.06); }

/* cards: the frame, rank and name are drawn here, the art sits whole in a 4:5 window */
div.room { background: #3a2a1d url(assets/ui/texture-wood.webp) 0 0 / 256px; padding: 12px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.45); }
.card { min-height: 0; padding: 6px 6px 8px; gap: 6px; display: flex; flex-direction: column; border-radius: 12px; border: 3px solid #8b7a5a; background: #e9e2d0 url(assets/ui/texture-parchment.webp) 0 0 / 220px; box-shadow: 0 3px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.45); }
.card.monster { background: #e9e2d0 url(assets/ui/texture-parchment.webp) 0 0 / 220px; }
.card.weapon { border-color: #4f7aa8; }
.card.potion { border-color: #a3423f; }
.card.elite { outline: 0; border-color: #c99a2e; box-shadow: 0 0 0 2px #6d4f12, 0 0 18px rgba(224,180,80,.45), 0 6px 14px rgba(0,0,0,.45); }
.card .art { position: relative; aspect-ratio: 4 / 5; border-radius: 7px; overflow: hidden; background: #151a21; box-shadow: inset 0 0 0 1px rgba(0,0,0,.6); }
.card .art img { display: block; width: 100%; height: 100%; object-fit: contain; }
.card .art::after { content: ''; position: absolute; inset: 0; border-radius: 7px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), inset 0 0 14px rgba(0,0,0,.35); pointer-events: none; }
.card .rank { position: absolute; top: 5px; left: 5px; z-index: 1; min-width: 34px; padding: 4px 6px 3px; border-radius: 6px; text-align: center; background: rgba(233,226,208,.94); color: var(--ink); font: 700 20px/1 var(--mono); box-shadow: 0 1px 3px rgba(0,0,0,.5); }
.card .rank small { font-size: 15px; margin-left: 1px; }
.card.weapon .rank { color: #2e5f93; } .card.potion .rank { color: #a3323a; } .card.elite .rank { background: #e7c66e; }
.card .name { display: grid; gap: 1px; text-align: center; }
.card .face { font: 400 16px/1.15 var(--display); }
.card .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; color: #6b5f4e; }
.card.weapon .kind { color: #2e5f93; } .card.potion .kind { color: #a3323a; } .card.elite .kind { color: #8a5f0c; }
.card .acts { margin-top: auto; }
.pile { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; vertical-align: middle; }
.pile img { width: 24px; height: 34px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }

/* contracts: offers on parchment with wax seals, the signed contract on paper */
.offers { grid-template-columns: repeat(auto-fit, minmax(140px, 170px)); justify-content: center; gap: 14px; }
.offer, .offer.clause { position: relative; background: url(assets/ui/contract-parchment.webp) center / 100% 100% no-repeat; border: 0; border-radius: 0; color: var(--paper-ink); padding: 20px 15% 34px; min-height: 220px; justify-items: center; align-content: start; text-align: center; gap: 3px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); transition: transform .15s; }
.offer:hover:not(:disabled) { transform: translateY(-3px) rotate(-.6deg); }
.offer:focus-visible { outline: 2px solid var(--verdigris); outline-offset: 3px; }
.offer.lit { outline: 3px solid var(--verdigris); outline-offset: 2px; border-radius: 6px; }
.offer .seal { width: 56px; height: 56px; margin-bottom: 2px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.offer .tier { font: 400 20px var(--display); }
.offer .muted { color: var(--paper-muted); }
.offer .price { color: var(--paper-gold); font-weight: 700; }
.offer .clause-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.offer .clause-row .seal { width: 34px; height: 34px; margin: 0; }
.offer .cl { color: var(--paper-red); }
.contract.paper { position: relative; background: #e3d8bd url(assets/ui/texture-parchment.webp) 0 0 / 320px; color: var(--paper-ink); border: 1px solid #8b7a5a; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
.contract.paper .price { color: var(--paper-gold); font-weight: 700; }
.contract.paper .muted, .paper .lh { color: var(--paper-muted); }
.paper .lh b { color: var(--paper-ink); }
.paper .lh.warn, .paper .lh.warn b { color: var(--paper-red); }
.contract.paper .cline { color: var(--paper-red); }
.contract.paper .progress { background: rgba(60,45,25,.18); box-shadow: inset 0 1px 2px rgba(0,0,0,.25); }
.contract.paper .progress i { background: #2f6f5f; }
.contract.paper .progress.met i { background: #b8892a; }
.contract.paper .pip { border-color: #9c8a6a; }
.contract.paper .pip.room.on { background: #2f6f5f; border-color: #2f6f5f; }
.seals { display: inline-flex; gap: 4px; align-items: center; }
.seals img { width: 40px; height: 40px; }
.contract.paper h2 { display: flex; align-items: center; gap: 8px; }

/* stamps: ink marks from the art, the word set in type */
.stamp { position: absolute; z-index: 2; width: 132px; aspect-ratio: 512 / 232; display: grid; place-items: center; pointer-events: none; opacity: .92; }
.stamp.fresh { animation: stampin .35s cubic-bezier(.2,1.5,.4,1) both; }
.stamp img { position: absolute; inset: 0; width: 100%; height: 100%; }
.stamp b { position: relative; font: 700 20px/1 var(--mono); letter-spacing: .14em; transform: rotate(-8deg); }
.stamp.paid b { color: #2f8f3e; } .stamp.strike b { color: #c8312f; } .stamp.raised b { color: #c8901a; }
.contract.paper .stamp { left: 50%; margin-left: -60px; top: 2px; width: 120px; }
@media (max-width: 560px) { .contract.paper .stamp { left: auto; right: 8px; margin: 0; top: -16px; width: 104px; } .contract.paper .stamp b { font-size: 16px; } }
@keyframes stampin { from { transform: scale(1.8); opacity: 0; } to { transform: none; opacity: .92; } }

/* people: bosses, the guild clerk */
.boss { background: var(--panel-bg); border: 1px solid rgba(208,84,91,.6); align-items: center; flex-wrap: nowrap; gap: 12px; }
.boss img, .clerk { width: 64px; height: 80px; border-radius: 6px; flex: none; object-fit: contain; box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.5); }
.boss .who { display: grid; gap: 2px; }
.boss .who .label { color: var(--blood); }
.coach { grid-template-columns: auto 1fr; column-gap: 14px; align-items: start; }
.coach > .clerk { grid-row: span 3; width: 56px; height: 70px; }
.coach > :not(.clerk) { grid-column: 2; }
.settle { position: relative; display: flex; gap: 14px; align-items: center; background: var(--panel-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.settle .clerk { width: 72px; height: 90px; }
.settle .say { display: grid; gap: 4px; min-width: 0; }
.settle .stamp { right: 12px; top: -16px; }
.settle p { margin: 0; font-size: 17px; }
.settle.stamped p { padding-top: 14px; }
.end { position: relative; background: var(--panel-bg); }
.end .stamp { right: 18px; top: 14px; width: 150px; }
.end .clerk { width: 96px; height: 120px; }
@media (max-width: 560px) { .end .stamp { right: 8px; top: 6px; width: 110px; } .end .stamp b { font-size: 16px; } }

/* relics and shop wares with their icons */
.relic { display: flex; flex-direction: row; align-items: center; gap: 10px; }

.relic.empty { opacity: .55; border-style: dashed; }
.ware .whead { display: flex; align-items: center; gap: 10px; }

#fx img.fx-ink { animation-duration: .9s; }
#fx img.fx-smoke { animation-duration: .8s; }
.card.leaving { transition: transform .26s ease-in, opacity .26s ease-in; transform: translateY(-10px) scale(.94); opacity: 0; pointer-events: none; }
@keyframes fxpop { 0% { transform: scale(.4); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(1.15); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } .offer { transition: none; } }
</style>

<script>/*ENGINE*/</script>

<script>
const E = window.Engine;
// Semantic version: MAJOR = overhaul or redesign, MINOR = update, PATCH = bug fix. Bump it in every change and add a CHANGELOG.md entry.
// Runs from before versioning carry the old tags 'v3' (first public playtest) and 'v4'.
const VERSION = '1.0.0';
// Web build only: where run reports go (a Google Form). Empty in the Claude-hosted build.
const REPORT = { url: '', entry: '' }; /*REPORT_CONFIG*/
const webReports = () => !!(REPORT.url && REPORT.entry) && dbState !== 'on';
const app = document.getElementById('app');
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const face = { monster: 'Monster', weapon: 'Weapon', potion: 'Potion' };
// Card names match the card art: spades are the undead, clubs the beasts and goblinkin.
const monsterNames = {
  '♠': { 2: 'Rats', 3: 'Bone Spider', 4: 'Zombie', 5: 'Ghost', 6: 'Skeleton Warrior', 7: 'Ghoul', 8: 'Wraith', 9: 'Mummy', 10: 'Bone Golem', 11: 'Jailer', 12: 'Banshee Matriarch', 13: 'Skeleton King', 14: 'Vampire Lord' },
  '♣': { 2: 'Goblin Scavenger', 3: 'Cave Bat', 4: 'Kobold Trapper', 5: 'Dire Wolf', 6: 'Hobgoblin', 7: 'Centipede', 8: 'Bugbear', 9: 'Owlbear', 10: 'Cave Troll', 11: 'Orc Warden', 12: 'Spider Broodmother', 13: 'Goblin King', 14: 'Forest Wyrm' },
  '★': { 15: 'Dungeon Horror', 17: 'Dread Dragon' },
};
const weaponNames = { 2: 'Kitchen Knife', 3: 'Club', 4: 'Dagger', 5: 'Hand Axe', 6: 'Mace', 7: 'Short Sword', 8: 'War Hammer', 9: 'Longsword', 10: 'Runed Greatsword' };

// ---------- art (files in assets/, made by src/import_art.py) ----------
const ART = 'assets/';
const img = (path, cls = '', alt = '') => `<img src="${ART}${path}" alt="${alt}"${cls ? ` class="${cls}"` : ''} decoding="async">`;
const potionSize = v => v >= 8 ? 'large' : v >= 5 ? 'medium' : 'small';
function cardArt(c) {
  if (c.kind === 'monster') return c.suit === '★' ? `cards/elite-${c.v}.webp` : `cards/${c.suit === '♠' ? 'spades' : 'clubs'}-${c.v}.webp`;
  if (c.kind === 'weapon') return `cards/weapon-${Math.max(2, Math.min(10, c.v))}.webp`;
  return `cards/potion-${potionSize(c.v)}.webp`;
}
const iconOf = k => E.RELICS[k] ? `icons/relic-${k === 'keenedge' ? 'keen-edge' : k}.webp` : `icons/service-${k}.webp`;
const tierSeal = t => `ui/seal-tier-${['safe', 'bold', 'reckless'][t]}.webp`;
const clauseSeal = k => `ui/seal-clause-${({ sworn: 'sworn', abstain: 'abstinent', steel: 'steel-oath', bare: 'bare-oath' })[k]}.webp`;
const bossArt = { fleeToll: 'boss-warden', halfPotion: 'boss-plague-hag', recklessOnly: 'boss-lich-auditor' };
const clerk = (mood, cls = 'clerk') => img(`portraits/clerk-${mood}.webp`, cls, 'The guild clerk');
// A stamp slams down once; later renders of the same stamp sit still.
const stamped = new Set();
const stamp = (kind, key) => {
  const fresh = !stamped.has(key); stamped.add(key);
  return `<span class="stamp ${kind} ${fresh ? 'fresh' : ''}">${img(`ui/stamp-${kind}.webp`)}<b>${kind.toUpperCase()}</b></span>`;
};
function scene() {
  if (s.phase === 'bid') return 'contract-board';
  if (s.phase === 'room') return ['act1-crypt', 'act2-sewers', 'act3-vault'][Math.min(2, E.act(s))];
  if (s.phase === 'shop') return 'guild-hall';
  if (s.phase === 'tutdone') return 'title';
  return s.phase === 'won' ? 'victory' : 'defeat';
}
let shownScene = '';
function setScene() {
  const sc = scene(); if (sc === shownScene) return;
  shownScene = sc;
  const el = document.getElementById('scene');
  el.style.backgroundImage = `url(${ART}backgrounds/${sc}.webp)`;
  el.classList.toggle('dim', sc === 'act2-sewers'); // the sewer art is busy behind cards
}
// Effects: a one-shot sprite over a spot on screen. Skipped for reduced motion.
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function fx(name, rect) {
  const layer = document.getElementById('fx');
  if (reduceMotion || !rect || !layer || !rect.width) return;
  const size = Math.round(Math.min(200, Math.max(96, rect.width * 0.9)));
  const el = document.createElement('img');
  el.src = `${ART}fx/${name}.webp`; el.alt = ''; el.className = 'fx-' + name;
  el.style.cssText = `left:${rect.left + rect.width / 2 - size / 2}px;top:${rect.top + rect.height / 2 - size / 2}px;width:${size}px;height:${size}px`;
  el.addEventListener('animationend', () => el.remove());
  layer.appendChild(el); setTimeout(() => el.remove(), 2000);
}
const rectOf = sel => { const el = document.querySelector(sel); return el && el.getBoundingClientRect(); };

// ---------- per-viewer conveniences (browser storage; may be unavailable) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('gl-' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('gl-' + k, JSON.stringify(v)); } catch {} },
};
let seenHints = store.get('hints', {});

// ---------- tutorial ----------
// Each step allows exactly one action, so the coach text always matches the table.
const TUTORIAL = [
  { allow: { bid: 0 }, text: 'Your goal: get through the dungeon one floor at a time <b>without your health reaching 0</b>. Each floor starts with a <b>contract</b>: a promise to kill a number of monster points. Sign this practice one.' },
  { allow: { v: 7, mode: null }, text: 'Each room has 4 cards. You pick <b>3</b>; the last one waits for the next room. First, pick up the <b>Short Sword (7)</b>.' },
  { allow: { v: 9, mode: 'weapon' }, text: 'A weapon blocks damage. The <b>Owlbear (9)</b> minus your sword (7) means you only lose <b>2</b> health, and you earn 9 points.' },
  { allow: { v: 5, mode: 'weapon' }, text: 'Catch: after each kill, your weapon can only hit monsters <b>no bigger</b> than that one. So go from big to small. Hit the <b>Ghost (5)</b>.' },
  { allow: { v: 3, mode: 'weapon' }, text: 'New room. Your sword now only hits <b>5 or less</b>. Use it on the <b>Cave Bat (3)</b>.' },
  { allow: { v: 10, mode: 'bare' }, text: 'The <b>Bone Golem (10)</b> is too big for your sword, so you fight with fists and lose the full <b>10</b>. In a real game you can <b>flee</b> a room you don\'t like before touching it.' },
  { allow: { v: 6, mode: null }, text: 'Ouch. Drink the <b>Tonic (6)</b> to heal. Only one potion per room works.' },
];
let tut = null; // { step } while the tutorial runs

// ---------- game state and playtest record ----------
let s;
let rec = null;
function newRec() {
  return {
    id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), version: VERSION,
    startedAt: new Date().toISOString(), endedAt: null, status: 'in_progress', outcome: null,
    floorReached: 1, totalSlain: 0, gold: 0, strikes: 0, relics: [], floors: [], shops: [], actions: 0, note: '',
  };
}
function startRun() { tut = null; lastHit = null; s = E.newGame(undefined, { guided: true }); rec = newRec(); store.set('tutorial', true); }
function startTutorial() { if (rec && rec.status === 'in_progress' && rec.floors.length) { rec.status = 'abandoned'; save(); } sendReport(rec); s = E.newTutorial(); rec = null; tut = { step: 0 }; }

// ---------- shared playtest log (db capability) ----------
let db = null, uid = null, owner = false, myDoc = null, saving = Promise.resolve(), dbState = 'connecting';
(async () => {
  try {
    const user = await window.claude?.use?.('user');
    db = await window.claude?.use?.('db');
    if (!db || !user) { dbState = 'off'; render(); return; }
    uid = await user.id();
    owner = await user.isOwner();
    if (!uid) { dbState = 'off'; render(); return; }
    if (!owner && (await user.can('data.write')) === false) { dbState = 'readonly'; render(); return; }
    const snap = await db.doc('playtests/' + uid).get();
    myDoc = snap.exists ? { ...snap.data() } : { runs: [] };
    myDoc.runs = Array.isArray(myDoc.runs) ? myDoc.runs.slice() : [];
    dbState = 'on';
  } catch { dbState = 'off'; }
  render();
})();
function save() {
  if (dbState !== 'on' || !rec) return;
  const snapshot = JSON.parse(JSON.stringify(rec));
  saving = saving.then(async () => {
    const runs = myDoc.runs.filter(r => r.id !== snapshot.id);
    runs.push(snapshot);
    myDoc = { runs: runs.slice(-100), tutorialDone: !!store.get('tutorial', false), updatedAt: new Date().toISOString() };
    try { await db.doc('playtests/' + uid).set(myDoc); }
    catch (e) { if (e && e.code === 'invalid_argument') { dbState = 'readonly'; render(); } }
  });
  return saving;
}

// ---------- recording hooks ----------
const curFloor = () => rec && rec.floors[rec.floors.length - 1];
function afterAction(prevPhase) {
  if (!rec) return;
  rec.actions++;
  const f = curFloor();
  if (prevPhase === 'room' && s.phase !== 'room' && f) { // floor or run just ended
    f.slain = s.slain;
    f.met = f.slain >= f.target; f.hpEnd = s.hp; f.died = s.hp === 0;
    rec.totalSlain = s.totalSlain;
  }
  if (s.phase === 'shop' && prevPhase !== 'shop') rec.shops.push({ floor: s.floor + 1, offered: s.shop.relics.slice(), bought: [], goldIn: s.gold });
  rec.floorReached = s.floor + 1; rec.gold = s.gold; rec.strikes = s.strikes; rec.relics = s.relics.slice();
  if (s.phase === 'won' || s.phase === 'lost') {
    rec.status = 'finished'; rec.outcome = s.phase === 'won' ? 'won' : s.hp === 0 ? 'died' : 'struck_out';
    rec.endedAt = new Date().toISOString(); rec.lastResult = s.lastResult;
  }
  if (prevPhase !== s.phase || s.phase === 'won' || s.phase === 'lost') save();
}

// ---------- hints (one-time tips for real runs) ----------
function currentHint() {
  if (tut) return null;
  const multi = s.offers && s.offers.length > 1;
  const list = [
    ['warmup', s.phase === 'bid' && !multi && s.floor === 0, 'Floor 1 is a warm-up with a single contract. Look at the room below, then sign it. More options open up as you go deeper.'],
    ['met', s.phase === 'room' && s.contract && s.slain >= s.contract.target, '<b>Contract met!</b> Extra points only pay a little more gold, so from here on, <b>protect your health</b>: take the smallest hits and drink potions.'],
    ['shop', s.phase === 'shop', 'Welcome to the guild hall. Spend gold on <b>relics</b>: each one bends a rule for the rest of the run. You don\'t have to buy anything.'],
    ['tiers', s.phase === 'bid' && multi && !s.boss, '<b>New: Bold and Reckless contracts.</b> A bigger target pays more gold, but a miss is a strike. When in doubt, Safe is fine.'],
    ['raise', s.phase === 'room' && E.canRaise(s), '<b>New: raise.</b> If a floor is going well, you can raise your contract one step between rooms, for more gold. Once per floor.'],
    ['dues', s.phase === 'shop' && s.floor % 3 === 1, '<b>Guild dues:</b> after the next floor, the guild collects a fee (top of the screen). Keep enough gold, or it\'s a strike.'],
    ['boss', s.phase === 'bid' && s.boss, '<b>Boss floor.</b> The boss adds one special rule for this floor. Read it before you sign.'],
    ['clause', s.phase === 'bid' && s.offers.some(o => o.clause), '<b>New: clauses.</b> The offer with a second wax seal pays 1.5× as much, but adds a rule for this floor.'],
    ['limit', s.phase === 'room' && s.weapon && s.weapon.limit != null, 'Your weapon has dulled: it only hits monsters up to the number shown under Weapon. Bigger ones need fists, or a new weapon.'],
  ];
  const h = list.find(([k, cond]) => cond && !seenHints[k]);
  return h ? { key: h[0], text: h[2] } : null;
}
function duesWarning() {
  if (tut || !['bid', 'room', 'shop'].includes(s.phase)) return '';
  const lastOfAct = s.phase === 'shop' ? s.floor % 3 === 1 : s.floor % 3 === 2;
  if (!lastOfAct) return '';
  const due = E.DUES[s.phase === 'shop' ? E.act({ floor: s.floor + 1 }) : E.act(s)];
  const short = s.gold < due;
  return `<p class="warn ${short ? 'short' : ''}">Guild dues of <b class="num">${due}</b> gold are due after ${s.phase === 'shop' ? 'the next floor' : 'this floor'}. You have <b class="num">${s.gold}</b>.${short ? ' Miss them and it\'s a strike.' : ''}</p>`;
}

// ---------- goal line: what to do right now, in one sentence ----------
function goalHTML() {
  if (tut) return '';
  const floorsLeft = E.FLOORS - s.floor;
  if (s.phase === 'bid') return `<p class="goal"><span class="label">Goal</span><span>Survive <b>${floorsLeft}</b> more floor${floorsLeft === 1 ? '' : 's'}. First, sign a contract for this one.</span></p>`;
  if (s.phase === 'room') {
    const need = s.contract.target - s.slain, left = roomsOnFloor() - s.roomsCleared;
    if (need <= 0) return `<p class="goal done"><span class="label">Contract met</span><span>Now just stay alive for ${left} more room${left === 1 ? '' : 's'}. Take small hits and drink potions.</span></p>`;
    return `<p class="goal"><span class="label">Goal</span><span>Kill <b>${need}</b> more monster points in <b>${left}</b> room${left === 1 ? '' : 's'}, without your health reaching 0.</span></p>`;
  }
  if (s.phase === 'shop') return `<p class="goal"><span class="label">Floor ${s.floor + 1} of ${E.FLOORS} done</span><span>Spend gold if you like, then head down.</span></p>`;
  return '';
}

// ---------- rendering ----------
function cardName(c) {
  if (c.kind === 'monster') return (monsterNames[c.suit] || {})[c.v] || 'Horror';
  if (c.kind === 'weapon') return weaponNames[c.v] || 'Blade';
  return { large: 'Elixir', medium: 'Tonic', small: 'Salve' }[potionSize(c.v)];
}
function fightLabel(c, weapon) {
  const d = E.monsterDamage(s, c, weapon);
  if (d >= s.hp) return `${weapon ? 'Weapon' : 'Fists'}: take ${d} (fatal)`;
  const pts = E.contractPoints({ ...s, hp: s.hp - d }, c, !weapon);
  return `${weapon ? 'Weapon' : 'Fists'}: take ${d} · +${pts}`;
}
function potionPreview(c) {
  const h = E.potionHeal(s, c);
  if (!h) return 'Discard (no healing)';
  const heal = Math.min(h, s.maxHp - s.hp);
  return `Drink: heal ${heal}` + (s.relics.includes('alchemist') && h > heal ? ` · +${h - heal}` : '');
}
function allowed(c, mode) {
  if (!tut) return true;
  const a = TUTORIAL[tut.step] && TUTORIAL[tut.step].allow;
  return !!a && a.v === c.v && a.mode === mode;
}
function cardHTML(c, active) {
  const btn = (mode, label) => `<button data-act="${mode || 'take'}" data-id="${c.id}" ${allowed(c, mode) ? '' : 'disabled'}>${label}</button>`;
  let acts = '';
  if (c.kind === 'monster') {
    if (E.canUseWeapon(s, c)) acts += btn('weapon', fightLabel(c, true));
    acts += btn('bare', fightLabel(c, false));
  } else if (c.kind === 'weapon') {
    acts = btn(null, `Equip${s.relics.includes('grindstone') ? ` as ${c.v + 1}♦` : ''}${s.weapon ? ` (drops ${s.weapon.v}♦)` : ''}`);
  } else acts = btn(null, potionPreview(c));
  const lit = tut && TUTORIAL[tut.step] && TUTORIAL[tut.step].allow.v === c.v && s.phase === 'room';
  return `<article class="card ${c.kind} ${c.v >= 15 ? 'elite' : ''} ${active ? '' : 'idle'} ${lit ? 'lit' : ''}" data-card="${c.id}">
    <div class="art">${img(cardArt(c))}<span class="rank">${E.rankLabel(c.v)}<small>${c.suit}</small></span></div>
    <div class="name"><span class="face">${cardName(c)}</span><span class="kind">${c.v >= 15 ? 'Elite monster' : face[c.kind]}</span></div>
    <div class="acts">${acts}</div></article>`;
}
function statusHTML() {
  const w = s.weapon ? `${s.weapon.v}♦ <span class="muted" style="font-size:13px">${s.weapon.limit == null ? 'fresh' : 'hits ≤ ' + E.rankLabel(s.weapon.limit)}</span>` : '<span class="muted">none</span>';
  return `<section class="status" aria-label="Status">
    <div class="stat"><span class="label">${img('icons/hud-hp.webp')}Health</span><span class="num">${s.hp}<span class="muted">/${s.maxHp}</span></span><div class="hpbar"><i style="width:${100 * s.hp / s.maxHp}%"></i></div></div>
    <div class="stat"><span class="label">${img('icons/hud-gold.webp')}Gold</span><span class="num price">${s.gold}</span></div>
    <div class="stat"><span class="label">${img('icons/hud-weapon-slot.webp')}Weapon</span><span class="num">${w}</span></div>
    <div class="stat"><span class="label">${img('icons/emblem-guild.webp')}Dues after floor ${E.act(s) * 3 + 3}</span><span class="num price">${tut ? '—' : E.DUES[E.act(s)]}<span class="muted" style="font-size:13px"> gold</span></span></div>
    <div class="stat"><span class="label">${img('icons/hud-strike.webp')}Strikes</span><div class="pips">${[0, 1, 2].map(i => `<span class="pip ${i < s.strikes ? 'on' : ''}"></span>`).join('')}</div></div>
  </section>`;
}
const bossCard = (b, label) => `<div class="boss">${img(`portraits/${bossArt[b.key]}.webp`, '', b.name)}<div class="who"><span class="label">${label}</span><b>${b.name}</b><span>${b.rule}</span></div></div>`;
const bossHTML = () => s.boss ? bossCard(s.boss, 'Boss floor') : '';
function relicsHTML(withDrop) {
  if (tut) return '';
  if (!s.relics.length && !withDrop) return `<p class="muted" style="margin:0">No relics yet. Buy them in the shop between floors (${E.MAX_RELICS} slots).</p>`;
  const empty = withDrop ? Array.from({ length: E.MAX_RELICS - s.relics.length }, () => `<div class="relic empty">${img('icons/hud-relic-slot.webp', 'ico')}<span class="muted">Empty slot</span></div>`).join('') : '';
  return `<div class="relics">${s.relics.map(k => `<div class="relic">${img(iconOf(k), 'ico')}<div class="rbody"><div class="row"><b>${E.RELICS[k].name}</b>${withDrop ? `<button class="link" data-drop="${k}">Drop</button>` : ''}</div><span class="muted" style="font-size:14px">${E.RELICS[k].text}</span></div></div>`).join('')}${empty}</div>`;
}
const roomsOnFloor = () => s.tutorial ? 2 : E.ROOMS_PER_FLOOR;
function contractHTML() {
  const c = s.contract;
  const pct = Math.min(100, 100 * s.slain / c.target);
  return `<section class="contract paper">${s.raises ? stamp('raised', `raise-${s.floor}-${s.raises}`) : ''}
    <div class="contract-row"><h2><span class="seals">${img(tierSeal(c.tier))}${c.clause ? img(clauseSeal(c.clause)) : ''}</span>${tut ? 'Training' : E.TIERS[c.tier]} contract</h2>${tut ? '' : `<span>Pays <span class="num price">${c.pay}</span> gold + overkill</span>`}</div>
    ${c.clause ? `<div class="cline"><b>${E.CLAUSES[c.clause].name}:</b> ${E.CLAUSES[c.clause].text}</div>` : ''}
    <div class="contract-row"><span>Slain <span class="num">${s.slain}</span> of <span class="num">${c.target}</span> points</span>
      <span class="pips" title="Rooms cleared">${Array.from({ length: roomsOnFloor() }, (_, i) => `<span class="pip room ${i < s.roomsCleared ? 'on' : ''}"></span>`).join('')}<span class="muted" style="font-size:13px">rooms</span></span></div>
    <div class="progress ${s.slain >= c.target ? 'met' : ''}"><i style="width:${pct}%"></i></div>
  </section>`;
}
function peekHTML() {
  if (!s.relics.includes('lantern') || !s.draw.length) return '';
  const n = s.draw[0];
  return `<p class="peek muted" style="margin:0">Lantern: the next card is <b style="color:var(--bone)">${E.rankLabel(n.v)}${n.suit} ${cardName(n)}</b>.</p>`;
}
const logHTML = () => tut ? '' : `<section><div class="label" style="margin-bottom:6px">Log</div><div class="log">${s.log.map(l => `<p>${esc(l)}</p>`).join('') || '<p class="muted">Your deeds will be recorded here.</p>'}</div></section>`;
function coachHTML() {
  if (tut && TUTORIAL[tut.step]) return `<aside class="coach">${clerk('neutral')}<span class="label">Training · step ${tut.step + 1} of ${TUTORIAL.length}</span><p>${TUTORIAL[tut.step].text}</p><button class="link" data-skiptut>Skip training</button></aside>`;
  const h = currentHint();
  return h ? `<aside class="coach hint">${clerk('neutral')}<span class="label">Tip</span><p>${h.text}</p><button class="link" data-hint="${h.key}">Got it</button></aside>` : '';
}
const rules = `<details class="rules"><summary>How to play</summary><ol>
  <li><b>Goal:</b> survive ${E.FLOORS} floors. You lose if your health hits 0, or if you get 3 strikes.</li>
  <li><b>Rooms:</b> each room shows 4 cards. Pick 3; the last one stays for the next room. A floor is ${E.ROOMS_PER_FLOOR} rooms.</li>
  <li><b>Monsters</b> cost health equal to their number, and give you that many points. <b>Weapons</b> block damage equal to their number, but after a kill they only hit monsters no bigger than that one. <b>Potions</b> heal (one per room).</li>
  <li><b>Contracts:</b> before each floor, promise how many monster points you'll kill. Make it and you get gold. Miss it and you get a strike.</li>
  <li><b>Fleeing:</b> before touching a room you can skip it, but not two rooms in a row.</li>
  <li><b>Gold</b> buys relics between floors. Every 3 floors the guild charges dues; if you can't pay, that's a strike.</li>
</ol><button class="link" data-tutorial>Replay the training floor</button></details>`;
function syncNote() {
  if (webReports()) return `<p class="muted sync">Playtest build: a summary of each run is sent to the designer when it ends.</p>`;
  if (dbState === 'on') return `<p class="muted sync">This run is saved to the guild's playtest log.</p>`;
  if (dbState === 'readonly') return `<p class="muted sync">Runs aren't saved automatically on this link. Use "Copy run report" at the end of a run and send it to whoever shared the game.</p>`;
  return '';
}
let lastHit = null; // the last monster fought, to explain a death
function whyHTML() {
  if (s.phase !== 'lost' || !rec) return '';
  if (s.hp > 0) return `<div class="why"><p><b>What happened:</b> the guild took your license after 3 strikes. You get a strike for each missed contract or unpaid dues.</p><p><b>Try next time:</b> pick Safe contracts until you have a feel for it, and keep some gold for dues.</p></div>`;
  const h = lastHit, met = s.contract && s.slain >= s.contract.target;
  const what = h ? `the ${esc(h.name)} (${h.v}) hit you for ${h.dmg}${h.mode === 'bare' ? ' because you fought it with fists' : ''}.` : 'your health reached 0.';
  const tip = met ? 'You had already met your contract, so you didn\'t need that fight. Once the bar turns gold, pick the cards that cost the least health.'
    : h && h.mode === 'bare' ? 'Fists cost a monster\'s full number in health. Pick up weapons early, use them on the biggest monsters first, and flee a room that looks too dangerous.'
    : 'Watch your health more than your points. Drink potions when you\'re low, and flee a room that looks too dangerous.';
  return `<div class="why"><p><b>What happened:</b> ${what}</p><p><b>Try next time:</b> ${tip}</p></div>`;
}
function endHTML() {
  const won = s.phase === 'won';
  const fb = dbState === 'on' && rec ? `<label class="fb" for="fb">Anything confusing, boring or great? One line helps.</label>
      <textarea id="fb" rows="2" maxlength="600">${esc(rec.note || '')}</textarea>
      <button data-fb>${rec.note ? 'Update note' : 'Save note'}</button><span id="fbstate" class="muted"></span>` : '';
  const key = 'end-' + (rec ? rec.id : s.floor);
  const mark = won ? stamp('paid', key) : /revokes your license/.test(s.lastResult || '') ? stamp('strike', key) : '';
  return `<section class="end">${mark}${clerk(won ? 'pleased' : 'disapproving')}<h2>${won ? 'Ledger closed. You survived.' : 'Run over'}</h2>
      <p style="margin:0">${esc(s.lastResult || '')}</p>${whyHTML()}
      <p class="muted" style="margin:0">Reached floor <span class="num">${s.floor + 1}</span> · slew <span class="num">${s.totalSlain + (won ? 0 : s.slain)}</span> points · <span class="num">${s.gold}</span> gold</p>
      ${fb}${webReports() && rec ? webFormHTML() : ''}
      ${dbState !== 'on' && rec && !webReports() ? `<p class="muted" style="margin:0">Playtesting? Copy this report and send it to whoever shared the game.</p>
      <textarea id="report" rows="4" readonly>${esc(runReport())}</textarea><button data-copy>Copy run report</button><span id="copystate" class="muted"></span>` : ''}
      <button class="primary" data-new>New run</button></section>`;
}
function webFormHTML() {
  return `<label class="fb" for="pname">Your name (optional)</label>
      <input id="pname" maxlength="40" value="${esc(store.get('name', ''))}">
      <label class="fb" for="wnote">Anything confusing, boring or great? One line helps.</label>
      <textarea id="wnote" rows="2" maxlength="600">${esc(rec.note || '')}</textarea>
      <button data-send ${rec.sent ? 'disabled' : ''}>${rec.sent ? 'Report sent. Thanks!' : 'Send report'}</button>
      <p class="muted" style="margin:0;font-size:13px">If you skip this, the report is sent without a note when you start a new run.</p>`;
}
// Posts the run to the Google Form. no-cors: the response can't be read, so this is fire-and-forget.
function sendReport(r) {
  if (!webReports() || !r || r.sent || !r.floors.length) return;
  r.sent = true;
  const name = store.get('name', '');
  const text = `${name ? 'Player: ' + name + '\n' : ''}${r.note ? 'Note: ' + r.note + '\n' : ''}${runReport(r)}\nData: ${JSON.stringify(r)}`;
  const body = new URLSearchParams({ [REPORT.entry]: text });
  try {
    if (document.visibilityState === 'hidden' && navigator.sendBeacon) navigator.sendBeacon(REPORT.url, body);
    else fetch(REPORT.url, { method: 'POST', mode: 'no-cors', body }).catch(() => {});
  } catch {}
}
window.addEventListener('pagehide', () => { if (rec && rec.status === 'in_progress') rec.status = 'abandoned'; sendReport(rec); });
function runReport(r = rec) {
  const out = { won: 'Won', died: 'Died', struck_out: 'Struck out' }[r.outcome] || (r.status === 'abandoned' ? 'Abandoned' : 'Ended');
  const floors = r.floors.map(f => `F${f.floor} ${E.TIERS[f.tier]}${f.clause ? '+' + E.CLAUSES[f.clause].name : ''} ${f.slain ?? '?'}/${f.target}${f.met ? ' met' : f.met === false ? ' missed' : ''}${f.raises ? ' raised' : ''}${f.flees ? ` fled${f.flees}` : ''}`).join('; ');
  const bought = r.shops.flatMap(sh => sh.bought.filter(k => E.RELICS[k]).map(k => E.RELICS[k].name)).join(', ') || 'none';
  const skipped = [...new Set(r.shops.flatMap(sh => sh.offered.filter(k => !sh.bought.includes(k)).map(k => E.RELICS[k].name)))].join(', ') || 'none';
  return `Guild Ledger v${VERSION} run report: ${out} on floor ${r.floorReached}, ${r.totalSlain} points, ${r.gold} gold.\nFloors: ${floors}\nRelics bought: ${bought}\nRelics passed on: ${skipped}`;
}
function tutDoneHTML() {
  return `<section class="end">${clerk('pleased')}<h2>Training complete</h2>
    <p style="margin:0">${esc(s.lastResult)} You're ready.</p>
    <ul class="recap">
      <li>A real floor is <b>${E.ROOMS_PER_FLOOR} rooms</b>. Make your contract, and don't let health hit 0.</li>
      <li>Missing a contract is a <b>strike</b>. Three strikes ends the run.</li>
      <li>New options (bigger contracts, raises, relics, clauses) open up as you go. The clerk will explain each one.</li>
    </ul>
    <button class="primary" data-new>Start your first run</button></section>`;
}
function statsHTML() {
  if (!owner || dbState === 'off' || tut) return '';
  return `<details class="rules" id="stats"><summary>Playtest stats (only you see this)</summary><div id="statsbody"><button data-stats>Load stats</button></div></details>`;
}

// The clerk reads out how the floor was settled, and stamps it.
function settleHTML() {
  const r = s.lastResult || '';
  const strike = /strike \d of 3/i.test(r), met = r.startsWith('Contract met');
  const mood = strike ? 'disapproving' : met ? 'pleased' : 'neutral';
  const mark = strike ? stamp('strike', 'floor-' + s.floor) : met ? stamp('paid', 'floor-' + s.floor) : '';
  return `<section class="settle ${mark ? 'stamped' : ''}">${mark}${clerk(mood)}<div class="say"><span class="label">The clerk's ledger</span><p class="result">${esc(r)}</p></div></section>`;
}

function render() {
  if (!s) return;
  setScene();
  const head = `<header><h1>${img('icons/emblem-guild.webp', 'emblem')}Guild Ledger</h1><span class="muted">${tut ? 'Training floor' : `Floor <span class="num">${s.floor + 1}</span>/${E.FLOORS} · Act ${E.act(s) + 1}`}</span></header>`;
  let body = '';
  if (s.phase === 'bid') {
    body = `${goalHTML()}${statusHTML()}${bossHTML()}${coachHTML()}${duesWarning()}
      <section class="contract board"><div class="contract-row"><h2>${s.offers.length > 1 ? 'Choose this floor\'s contract' : 'Sign this floor\'s contract'}</h2>${E.canRedraw(s) ? '<button data-redraw>Redraw room (Fortune Teller)</button>' : ''}</div>
        <p class="muted" style="margin:0">${s.offers.length > 1 ? `Here's the first room. How many monster points can you kill across ${roomsOnFloor()} rooms? Higher targets pay more.` : `Here's the first room. Kill this many monster points across ${roomsOnFloor()} rooms to get paid.`}</p>
        <div class="offers">${s.offers.map((o, i) => {
          const c = tut ? { target: 12, pay: 0 } : { target: E.TARGETS[s.floor][o.tier], pay: E.payout(s, o.tier, o.clause) };
          return `<button class="offer ${o.clause ? 'clause' : ''} ${tut ? 'lit' : ''}" data-bid="${i}">
          ${img(tierSeal(o.tier), 'seal')}<span class="tier">${tut ? 'Training' : E.TIERS[o.tier]}</span><span>Slay <span class="num">${c.target}</span></span>${tut ? '' : `<span class="muted">Pays <span class="num price">${c.pay}</span> gold</span>`}
          ${o.clause ? `<span class="clause-row">${img(clauseSeal(o.clause), 'seal')}<span class="cl">${E.CLAUSES[o.clause].name}</span></span><span class="muted" style="font-size:13px">${E.CLAUSES[o.clause].text}</span>` : ''}</button>`;
        }).join('')}</div>
      </section>
      <div class="room">${s.room.map(c => cardHTML(c, false)).join('')}</div>
      ${relicsHTML(false)}${tut ? '' : rules}${logHTML()}${statsHTML()}`;
  } else if (s.phase === 'room') {
    const fleeNote = s.boss && s.boss.key === 'fleeToll' ? ' (costs 4 HP)' : '';
    body = `${goalHTML()}${statusHTML()}${bossHTML()}${contractHTML()}${coachHTML()}${duesWarning()}
      <div class="roombar"><span><span class="pile" title="Cards left in the draw pile">${img('cards/back.webp')}<span class="num">${s.draw.length}</span></span>Room ${s.roomsCleared + 1}: deal with <b>${3 - s.handled}</b> more card${3 - s.handled === 1 ? '' : 's'}.</span>
        <span style="display:flex;gap:8px;flex-wrap:wrap">${E.canRaise(s) && !tut ? `<button data-raise>${img('icons/hud-raise.webp', 'bi')}Raise to ${E.TIERS[s.contract.tier + 1]}: slay ${E.TARGETS[s.floor][s.contract.tier + 1]}, pays ${E.payout(s, s.contract.tier + 1, s.contract.clause)}</button>` : ''}
        <button data-flee ${E.canFlee(s) && !tut ? '' : 'disabled'}>${img(E.canFlee(s) && !tut ? 'icons/hud-flee.webp' : 'icons/hud-locked.webp', 'bi')}Flee room${fleeNote}</button></span></div>
      <div class="room">${s.room.map(c => cardHTML(c, true)).join('')}</div>
      ${peekHTML()}${relicsHTML(false)}${tut ? '' : rules}${logHTML()}${statsHTML()}`;
  } else if (s.phase === 'shop') {
    const full = s.relics.length >= E.MAX_RELICS;
    const ware = (k, item) => `<div class="ware"><div class="whead">${img(iconOf(k), 'ico')}<b>${item.name}</b></div><span class="muted" style="font-size:14px">${item.text}</span>
      <button data-buy="${k}" ${s.shop.bought[k] || s.gold < item.cost || (E.RELICS[k] && full) ? 'disabled' : ''}>${s.shop.bought[k] ? 'Bought' : `Buy · <span class="num">${item.cost}</span>g`}</button></div>`;
    body = `${goalHTML()}${statusHTML()}
      ${settleHTML()}${coachHTML()}${duesWarning()}
      <section class="shop"><div class="contract-row"><h2>Guild hall</h2><span class="muted">Next: floor ${s.floor + 2}${E.BOSSES[s.floor + 1] ? ' · <span style="color:var(--blood)">boss</span>' : ''}</span></div>
        ${E.BOSSES[s.floor + 1] ? bossCard(E.BOSSES[s.floor + 1], 'Next floor') : ''}
        <div class="label">Relics ${full ? '(slots full: drop one to buy)' : ''}</div>
        <div class="shopgrid">${s.shop.relics.map(k => ware(k, E.RELICS[k])).join('') || '<p class="muted">Sold out.</p>'}</div>
        <div class="label">Services</div>
        <div class="shopgrid">${Object.entries(E.SERVICES).map(([k, v]) => ware(k, v)).join('')}</div>
        <div><button class="primary" data-leave>Descend to floor ${s.floor + 2}</button></div>
      </section>
      <div class="label">Your relics (${s.relics.length}/${E.MAX_RELICS})</div>${relicsHTML(true)}${logHTML()}${statsHTML()}`;
  } else if (s.phase === 'tutdone') {
    body = tutDoneHTML();
  } else {
    body = endHTML() + logHTML() + statsHTML();
  }
  app.innerHTML = head + body + syncNote() + `<p class="muted version">v${VERSION}</p>`;
}

// ---------- owner stats ----------
async function loadStats() {
  const el = document.getElementById('statsbody'); if (!el) return;
  el.innerHTML = '<p class="muted">Loading…</p>';
  let docs;
  try { docs = (await db.collection('playtests').get()).docs.map(d => d.data()); }
  catch { el.innerHTML = '<p class="muted">Couldn\'t load the playtest log. Try again in a moment.</p>'; return; }
  const runs = docs.flatMap(d => Array.isArray(d.runs) ? d.runs : []);
  const done = runs.filter(r => r.status === 'finished');
  if (!runs.length) { el.innerHTML = '<p class="muted">No runs recorded yet. Share the game with playtesters at Contributor level, and their runs will show up here.</p>'; return; }
  const pctOf = (n, d) => d ? Math.round(100 * n / d) + '%' : '–';
  const ends = Array(9).fill(0); done.forEach(r => { if (r.outcome !== 'won') ends[Math.min(8, r.floorReached - 1)]++; });
  const floors = runs.flatMap(r => r.floors || []);
  const tiers = [0, 1, 2].map(t => floors.filter(f => f.tier === t));
  const offered = {}, bought = {};
  runs.forEach(r => (r.shops || []).forEach(sh => { sh.offered.forEach(k => offered[k] = (offered[k] || 0) + 1); sh.bought.forEach(k => bought[k] = (bought[k] || 0) + 1); }));
  const picks = Object.keys(offered).filter(k => E.RELICS[k] && offered[k] >= 2).map(k => ({ k, rate: (bought[k] || 0) / offered[k], n: offered[k] })).sort((a, b) => b.rate - a.rate);
  const notes = runs.filter(r => r.note).slice(-8).reverse();
  el.innerHTML = `
    <p><b class="num">${docs.length}</b> player${docs.length === 1 ? '' : 's'} · <b class="num">${runs.length}</b> run${runs.length === 1 ? '' : 's'} (${done.length} finished, ${runs.filter(r => r.status === 'abandoned').length} abandoned, the rest unfinished) · ${docs.filter(d => d.tutorialDone).length} finished the training</p>
    <p>Finished runs: won <b>${pctOf(done.filter(r => r.outcome === 'won').length, done.length)}</b>, died <b>${pctOf(done.filter(r => r.outcome === 'died').length, done.length)}</b>, struck out <b>${pctOf(done.filter(r => r.outcome === 'struck_out').length, done.length)}</b></p>
    <p>Runs lost on floors 1–9: <span class="num">${ends.join(' · ')}</span></p>
    <p>Contracts: ${tiers.map((f, t) => `${E.TIERS[t]} ${f.length} signed, ${pctOf(f.filter(x => x.met).length, f.filter(x => x.met !== undefined).length)} met`).join(' · ')}. Raises: ${floors.reduce((a, f) => a + (f.raises || 0), 0)}. Flees: ${floors.reduce((a, f) => a + (f.flees || 0), 0)}.</p>
    ${picks.length ? `<p>Relic pick rate (bought when offered): most picked ${picks.slice(0, 4).map(p => `${E.RELICS[p.k].name} ${pctOf(p.rate, 1)}`).join(', ')}; least picked ${picks.slice(-4).reverse().map(p => `${E.RELICS[p.k].name} ${pctOf(p.rate, 1)}`).join(', ')}.</p>` : ''}
    ${notes.length ? `<div class="label">Latest notes</div><ul class="recap">${notes.map(r => `<li>${esc(r.note)} <span class="muted">(${({ won: 'won', died: 'died', struck_out: 'struck out', abandoned: 'abandoned', in_progress: 'unfinished' })[r.outcome || r.status]}, floor ${r.floorReached})</span></li>`).join('')}</ul>` : ''}
    <button data-stats>Refresh</button>`;
}

// ---------- input ----------
let busy = false; // true while a card's leave animation plays
app.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || b.disabled || busy) return;
  const d = b.dataset, prev = s.phase;
  let acted = true, effect = null;
  const cardEl = b.closest('.card');
  if (d.bid !== undefined) {
    if (!E.bid(s, +d.bid)) return;
    if (rec) rec.floors.push({ floor: s.floor + 1, tier: s.contract.tier, clause: s.contract.clause, target: s.contract.target, boss: s.boss ? s.boss.key : null, hpStart: s.hp, goldStart: s.gold, raises: 0, flees: 0 });
    if (rec && s.floor === 0) save();
    effect = () => fx('ink', rectOf('.contract.paper'));
  } else if (d.act) {
    // The effect plays on the card while it leaves the table, then the move resolves.
    const c = s.room.find(x => x.id === +d.id); if (!c) return;
    const name = c.kind === 'monster' ? (d.act === 'weapon' ? 'slash' : 'punch') : c.kind === 'potion' && E.potionHeal(s, c) > 0 && s.hp < s.maxHp ? 'heal' : null;
    if (cardEl && !reduceMotion) {
      busy = true; if (name) fx(name, cardEl.getBoundingClientRect()); cardEl.classList.add('leaving');
      await new Promise(r => setTimeout(r, 260)); busy = false;
    }
    if (c.kind === 'monster') { const w = d.act === 'weapon' && E.canUseWeapon(s, c); lastHit = { name: cardName(c), v: c.v, mode: w ? 'weapon' : 'bare', dmg: E.monsterDamage(s, c, w) }; }
    if (!E.handle(s, +d.id, d.act === 'take' ? null : d.act)) { render(); return; }
  } else if ('flee' in d) {
    const at = rectOf('.room');
    if (E.flee(s) && curFloor()) curFloor().flees++;
    effect = () => fx('smoke', at);
  }
  else if ('raise' in d) {
    if (E.raise(s) && curFloor()) { const f = curFloor(); f.raises++; f.target = s.contract.target; f.tier = s.contract.tier; f.raisedAtRoom = s.roomsCleared + 1; }
  }
  else if ('redraw' in d) E.redraw(s);
  else if (d.buy) {
    const at = b.closest('.ware') && b.closest('.ware').getBoundingClientRect();
    if (E.buy(s, d.buy)) { effect = () => fx('coins', at); if (rec && rec.shops.length) rec.shops[rec.shops.length - 1].bought.push(d.buy); }
  }
  else if (d.drop) E.dropRelic(s, d.drop);
  else if ('leave' in d) E.leaveShop(s);
  else if ('new' in d) {
    if (rec && rec.status === 'in_progress' && rec.floors.length) { rec.status = 'abandoned'; save(); }
    sendReport(rec);
    startRun(); acted = false;
  }
  else if ('tutorial' in d) { startTutorial(); acted = false; }
  else if ('skiptut' in d) { store.set('tutorial', true); startRun(); acted = false; }
  else if (d.hint) { seenHints[d.hint] = true; store.set('hints', seenHints); acted = false; }
  else if ('fb' in d) {
    const t = document.getElementById('fb'); if (!t || !rec) return;
    rec.note = t.value.trim().slice(0, 600);
    b.disabled = true; await save();
    const st = document.getElementById('fbstate'); if (st) st.textContent = dbState === 'on' ? 'Saved. Thanks!' : 'Couldn\'t save.';
    b.disabled = false; return;
  }
  else if ('stats' in d) { loadStats(); return; }
  else if ('send' in d) {
    const n = document.getElementById('pname'), t = document.getElementById('wnote');
    if (n) store.set('name', n.value.trim().slice(0, 40));
    if (t) rec.note = t.value.trim().slice(0, 600);
    sendReport(rec); render(); return;
  }
  else if ('copy' in d) {
    const t = document.getElementById('report'), st = document.getElementById('copystate');
    try { await navigator.clipboard.writeText(t.value); if (st) st.textContent = 'Copied.'; }
    catch { t.focus(); t.select(); if (st) st.textContent = 'Press Ctrl+C (or Cmd+C) to copy.'; }
    return;
  }
  else return;
  if (tut && acted) { tut.step++; if (s.phase === 'tutdone') store.set('tutorial', true); }
  if (acted) afterAction(prev);
  if (prev === 'room' && s.phase === 'shop' && (s.lastResult || '').startsWith('Contract met')) {
    const last = effect; effect = () => { if (last) last(); fx('coins', rectOf('.status .stat:nth-child(2)')); };
  }
  render();
  if (effect) effect();
});

if (store.get('tutorial', false)) startRun(); else { s = E.newTutorial(); tut = { step: 0 }; }
render();
</script>
<script>
// Guild Ledger: live on-screen hints. A self-contained add-on loaded after the game's UI script.
// It wraps the global render() and decorates the DOM it produces; it never changes game state.
// Complements the scripted tutorial, one-time tips and goal line: these hints react to the current cards and stay on (toggle in the header).
(function () {
  const KEY = 'gl-livehints';
  let prefs = { on: true };
  try { prefs = { ...prefs, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) {} };

  const css = document.createElement('style');
  css.textContent = `
.lh { font-size: 13px; line-height: 1.3; color: var(--ash); margin: 0; }
.lh b { color: var(--bone); font-weight: 600; }
.lh.warn, .lh.warn b { color: var(--gold); }
.card .lh { color: #5a5248; font-size: 12px; }
.card .lh.warn { color: #9a3a2e; font-weight: 600; }
.lh-toggle { display: flex; gap: 14px; align-items: baseline; font-size: 14px; }
`;
  document.head.appendChild(css);

  const E = window.Engine;
  const R = v => E.rankLabel(v);
  const has = k => s.relics.includes(k);
  const fleeToll = () => s.boss && s.boss.key === 'fleeToll';

  // On-screen hints: always available, toggled from the header.
  function monsterHint(c) {
    const can = s.weapon && E.canUseWeapon(s, c);
    if (s.weapon && !can) return `<p class="lh">Too strong for your weapon (hits ${R(s.weapon.limit)} or lower).</p>`;
    if (!can && E.monsterDamage(s, c, false) >= s.hp) return `<p class="lh warn">Fists would kill you.</p>`;
    if (can) {
      const old = s.weapon.limit == null ? Infinity : s.weapon.limit;
      if (c.v < old) return `<p class="lh">A weapon kill dulls it to ${R(c.v)} or lower.</p>`;
    }
    return '';
  }
  function cardHint(c) {
    if (c.kind === 'monster') return monsterHint(c);
    if (c.kind === 'potion') {
      if (E.potionHeal(s, c) === 0) return `<p class="lh warn">${s.potionUsed ? 'You already used a potion this room.' : 'Potions are blocked this floor.'}</p>`;
      if (s.hp === s.maxHp) return `<p class="lh">You're at full health.</p>`;
      return '';
    }
    const nv = c.v + (has('grindstone') ? 1 : 0);
    if (!s.weapon) return `<p class="lh">Equip to soften monster hits by ${nv}.</p>`;
    if (s.weapon.limit != null) return `<p class="lh">Fresh, so it can hit anything. Yours is dulled to ${R(s.weapon.limit)}.</p>`;
    return nv < s.weapon.v ? `<p class="lh warn">Weaker than your ${s.weapon.v}♦.</p>` : '';
  }
  function fleeReason() {
    if (E.canFlee(s)) return fleeToll() ? 'The Warden charges 4 health to flee.' : 'Flee to send this room to the bottom of the pile.';
    if (s.contract && s.contract.clause === 'sworn') return 'Your Sworn clause forbids fleeing.';
    if (s.handled > (has('scout') ? 1 : 0)) return 'You can only flee before touching a room.';
    if (fleeToll() && s.hp <= 4) return 'Too hurt to pay the Warden 4 health.';
    return "You can't flee two rooms in a row.";
  }
  const inTraining = () => typeof tut !== 'undefined' && tut;
  function decorate() {
    if (typeof s === 'undefined' || !s) return;
    const app = document.getElementById('app');
    const header = app.querySelector('header');
    if (header && !inTraining()) header.insertAdjacentHTML('beforeend', `<span class="lh-toggle"><button class="link" data-livehints><img src="assets/icons/hud-hints.webp" alt="" class="bi">Hints: ${prefs.on ? 'on' : 'off'}</button></span>`);
    const tips = ['Reach 0 and the run ends.', 'Earned from contracts. Pays for relics, services and dues.', 'Softens monster hits. After a kill it can only hit monsters up to that size.', "Paid at the end of each act. Can't pay: a strike.", 'Missed contracts and unpaid dues. 3 strikes ends the run.'];
    app.querySelectorAll('.status .stat').forEach((el, i) => { el.title = tips[i] || ''; });
    if (!prefs.on || inTraining()) return;

    if (s.phase === 'bid') {
      const offers = app.querySelector('.offers');
      const pts = s.room.filter(c => c.kind === 'monster').reduce((a, c) => a + c.v, 0);
      if (offers) offers.insertAdjacentHTML('afterend', `<p class="lh">The monsters in this first room add up to <b>${pts}</b> points.</p>`);
    } else if (s.phase === 'room') {
      app.querySelectorAll('.room .card').forEach(el => {
        const btn = el.querySelector('[data-id]'); if (!btn) return;
        const c = s.room.find(x => x.id === +btn.dataset.id); if (!c) return;
        const h = cardHint(c); if (h) el.querySelector('.acts').insertAdjacentHTML('beforebegin', h);
      });
      const fb = app.querySelector('[data-flee]');
      if (fb) fb.title = fleeReason();
      const bar = app.querySelector('.roombar');
      if (bar && !E.canFlee(s) && s.handled === 0) bar.insertAdjacentHTML('afterend', `<p class="lh">${fleeReason()}</p>`);
    }
  }

  const baseRender = render;
  render = function () { baseRender(); decorate(); };
  document.getElementById('app').addEventListener('click', e => {
    const b = e.target.closest('button[data-livehints]'); if (!b) return;
    prefs.on = !prefs.on; save(); render();
  });
  render();
})();
</script>
