<title>Guild Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&family=Spline+Sans+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single-column dungeon table. Status ledger on top, the room of four cards in the middle, contract and log below. Deliberately dark, single theme. */
:root {
  color-scheme: dark;
  --stone: #12161d;      /* page ground */
  --slab: #1b212b;       /* panels */
  --slab-2: #242c38;     /* raised */
  --line: #333d4c;
  --bone: #e9e2d0;       /* card faces, primary text */
  --ash: #9aa3b2;        /* secondary text */
  --verdigris: #4fb7a0;  /* accent: guild seal */
  --blood: #d0545b;      /* potions, damage */
  --steel: #7aa6d8;      /* weapons */
  --ink: #1d1a17;        /* text on bone */
  --gold: #e0b450;
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "Spline Sans Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--stone); color: var(--bone); }
body { font: 16px/1.45 var(--body); margin: 0; padding-inline: 16px; padding-block: 16px 40px; }
main { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font: 400 30px/1 var(--display); margin: 0; letter-spacing: .02em; }
h2 { font: 400 20px/1.1 var(--display); margin: 0; letter-spacing: .03em; text-wrap: balance; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ash); }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--ash); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
button { font: 600 15px var(--body); color: var(--bone); background: var(--slab-2); border: 1px solid var(--line); border-radius: 6px; padding: 9px 14px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--verdigris); }
button:focus-visible { outline: 2px solid var(--verdigris); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--verdigris); color: #08201b; border-color: var(--verdigris); }
.link { background: none; border: 0; padding: 0; color: var(--verdigris); text-decoration: underline; font-weight: 500; }

/* status ledger */
.status { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stat { background: var(--slab); padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.stat .num { font-size: 20px; font-weight: 700; }
.hpbar { height: 6px; background: var(--slab-2); border-radius: 3px; overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--blood); transition: width .3s; }
.pips { display: flex; gap: 5px; align-items: center; height: 26px; }
.pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.pip.on { background: var(--blood); border-color: var(--blood); }
.pip.room.on { background: var(--verdigris); border-color: var(--verdigris); }
@media (max-width: 620px) { .status { grid-template-columns: repeat(2, minmax(0, 1fr)); } .status .stat:first-child { grid-column: 1 / -1; } }

/* contract */
.contract { background: var(--slab); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
.contract-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.progress { height: 12px; background: var(--slab-2); border-radius: 6px; overflow: hidden; position: relative; }
.progress i { display: block; height: 100%; background: var(--verdigris); transition: width .3s; }
.progress.met i { background: var(--gold); }
.boss { border: 1px dashed var(--blood); border-radius: 8px; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.boss b { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--blood); }
.offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.offer.clause { border-style: dashed; border-color: var(--gold); }
.offer .cl { color: var(--gold); font-weight: 700; font-size: 14px; }
.cline { color: var(--gold); }
.offer { text-align: left; display: grid; gap: 4px; padding: 12px; }
.offer .tier { font: 400 18px var(--display); }
.offer .num { font-size: 18px; }


/* room */
.room { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .room { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { position: relative; background: var(--bone); color: var(--ink); border-radius: 10px; padding: 10px; min-height: 168px; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; box-shadow: 0 2px 0 rgba(0,0,0,.4); }
@media (prefers-reduced-motion: reduce) { .hpbar i, .progress i { transition: none; } }
.card .corner { display: flex; justify-content: space-between; align-items: baseline; }
.card .rank { font: 700 26px/1 var(--mono); }
.card .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
.card .face { font: 400 15px/1.2 var(--display); align-self: center; text-align: center; }
.card.monster .kind, .card.monster .rank { color: #2a2622; }
.card.monster { background: linear-gradient(#e9e2d0, #d9d0bb); }
.card.weapon .kind, .card.weapon .rank { color: #2e5f93; }
.card.potion .kind, .card.potion .rank { color: #a3323a; }
.card.elite { outline: 2px solid var(--gold); }
.card .acts { display: grid; gap: 6px; }
.card .acts button { background: var(--ink); color: var(--bone); border-color: var(--ink); padding: 7px 8px; font-size: 13px; text-align: left; }
.card .acts button:hover:not(:disabled) { border-color: var(--verdigris); }
.card.idle .acts button { visibility: hidden; }

/* relics, shop */
.relics { display: flex; flex-wrap: wrap; gap: 8px; }
.relic { background: var(--slab); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; flex: 1 1 200px; }
.relic b { font-family: var(--display); font-weight: 400; font-size: 16px; color: var(--verdigris); }
.relic .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.shop { display: grid; gap: 14px; background: var(--slab); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.shopgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .shopgrid { grid-template-columns: 1fr; } }
.ware { background: var(--slab-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; gap: 6px; align-content: start; }
.ware b { font-family: var(--display); font-weight: 400; font-size: 17px; }
.price { color: var(--gold); }

.log { background: var(--slab); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; max-height: 170px; overflow-y: auto; font-size: 14px; }
.log p { margin: 0; padding: 3px 0; border-bottom: 1px solid var(--slab-2); }
.log p:first-child { color: var(--bone); } .log p { color: var(--ash); }
.result { font-size: 17px; }
.end { text-align: center; display: grid; gap: 12px; padding: 30px 14px; background: var(--slab); border: 1px solid var(--line); border-radius: 8px; justify-items: center; }
.end h2 { font-size: 32px; }
details.rules { background: var(--slab); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
details.rules summary { cursor: pointer; font-weight: 700; }
details.rules ol { margin: 8px 0 4px; padding-left: 20px; display: grid; gap: 4px; }
.peek { font-size: 14px; }
.coach { border: 1px solid var(--verdigris); background: color-mix(in srgb, var(--verdigris) 12%, var(--slab)); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; justify-items: start; }
.coach p { margin: 0; max-width: 65ch; }
.coach.hint { border-color: var(--line); background: var(--slab); }
.warn { margin: 0; padding: 8px 12px; border-radius: 6px; background: var(--slab); border: 1px solid var(--line); }
.warn.short { border-color: var(--blood); }
aside.coach p.sub { font-size: 15px; line-height: 1.35; color: var(--ash); }
aside.coach p.sub b { color: var(--bone); }
.coach.goalonly .label { color: var(--verdigris); }
.coach.done { border-color: var(--gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 18%, transparent), 0 6px 18px rgba(0,0,0,.35); }
.coach.done .label { color: var(--gold); }
.why { text-align: left; max-width: 520px; margin: 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--slab-2); display: grid; gap: 6px; }
.why p { margin: 0; }
.card.lit, .offer.lit { outline: 3px solid var(--gold); outline-offset: 2px; box-shadow: 0 0 0 7px color-mix(in srgb, var(--gold) 28%, transparent); animation: focuspulse 1.3s ease-in-out infinite; }
.sync { font-size: 13px; text-align: center; margin: 4px 0 0; }
.version { font-size: 11px; text-align: center; margin: 6px 0 0; opacity: .6; }
.fb { font-weight: 500; }
textarea, input#pname { width: 100%; max-width: 480px; font: 15px var(--body); color: var(--bone); background: var(--slab-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
textarea:focus-visible, input#pname:focus-visible { outline: 2px solid var(--verdigris); }
.recap { text-align: left; max-width: 520px; margin: 0; padding-left: 20px; display: grid; gap: 6px; }
#statsbody p { margin: 6px 0; }

/* ---------- art (assets/ is built by src/import_art.py) ---------- */
:root {
  --panel-bg: linear-gradient(rgba(27,33,43,.9), rgba(27,33,43,.9)), url(assets/ui/texture-slate.webp) 0 0 / 256px;
  --paper-ink: #2b241c; --paper-muted: #5e5345; --paper-gold: #8a5f0c; --paper-red: #8e2d26;
}
html { background: var(--stone); }
body { background: transparent; }
#scene { position: fixed; inset: 0; z-index: 0; background: var(--stone) center / cover no-repeat; }
#scene::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,17,23,.5), rgba(14,17,23,.8) 45%, rgba(14,17,23,.9)); }
#scene.dim::after { background: linear-gradient(180deg, rgba(10,12,16,.74), rgba(10,12,16,.92) 45%); }
main { position: relative; z-index: 1; }
.stat, .shop, .log, details.rules, .end, .relic, .warn:not(.lh), .coach.hint, .contract.board { background: var(--panel-bg); }
h1 { display: flex; align-items: center; gap: 10px; }
header { align-items: center; }
h1 .emblem { width: 44px; height: 44px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
.stat .label { display: flex; align-items: center; gap: 6px; }
.stat .label img, .ico-sm { width: 22px; height: 22px; flex: none; }
.bi { width: 20px; height: 20px; vertical-align: -5px; margin-right: 6px; }
button.primary { background: #c9a24a url(assets/ui/texture-brass.webp) center / cover; color: #2a1d05; border-color: #7d5f1c; text-shadow: 0 1px 0 rgba(255,240,200,.35); }
button.primary:hover:not(:disabled) { border-color: #f1d488; filter: brightness(1.06); }

/* cards: the frame, rank and name are drawn here, the art sits whole in a 4:5 window */
div.room { background: #3a2a1d url(assets/ui/texture-wood.webp) 0 0 / 256px; padding: 12px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.45); }
/* A room is one framed table: its name and progress on top, the draw pile it is dealt from, and four slots. */
section.chamber { display: grid; gap: 10px; background: #3a2a1d url(assets/ui/texture-wood.webp) 0 0 / 256px; padding: 10px; border-radius: 14px; border: 2px solid #6b4e33; box-shadow: inset 0 0 40px rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.45); }
.chamber div.room { background: none; padding: 0; box-shadow: none; }
.chamber-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: rgba(12,9,6,.62); border-radius: 10px; padding: 10px 12px; color: var(--bone); }
.chamber-title { display: grid; gap: 4px; flex: 1; min-width: 170px; }
.chamber-title h2 { font-size: 22px; }
.chamber-title h2 .muted { font-size: 16px; }
.chamber-title > span { font-size: 15px; }
.chamber-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.chamber .pile { position: relative; width: 46px; height: 64px; flex: none; margin: 0 4px 0 0; }
.chamber .pile img { position: absolute; width: 42px; height: 58px; border-radius: 5px; box-shadow: 0 2px 4px rgba(0,0,0,.6); }
.chamber .pile img:nth-child(2) { left: 2px; top: 2px; } .chamber .pile img:nth-child(3) { left: 4px; top: 4px; }
.pip.pick { width: 12px; height: 12px; } .pip.pick.on { background: var(--gold); border-color: var(--gold); }
.slot { border: 2px dashed rgba(233,226,208,.35); border-radius: 12px; display: grid; place-content: center; justify-items: center; gap: 4px; color: rgba(233,226,208,.65); min-height: 140px; }
.slot b { font-size: 28px; line-height: 1; } .slot small { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.cardback { position: absolute; inset: -3px; border-radius: 12px; background: #1b212b url(assets/cards/back.webp) center / cover; pointer-events: none; z-index: 3; }
.card { min-height: 0; padding: 6px 6px 8px; gap: 6px; display: flex; flex-direction: column; border-radius: 12px; border: 3px solid #8b7a5a; background: #e9e2d0 url(assets/ui/texture-parchment.webp) 0 0 / 220px; box-shadow: 0 3px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.45); }
.card.monster { background: #e9e2d0 url(assets/ui/texture-parchment.webp) 0 0 / 220px; }
.card.weapon { border-color: #4f7aa8; }
.card.potion { border-color: #a3423f; }
.card.elite { outline: 0; border-color: #c99a2e; box-shadow: 0 0 0 2px #6d4f12, 0 0 18px rgba(224,180,80,.45), 0 6px 14px rgba(0,0,0,.45); }
.card .art { position: relative; aspect-ratio: 4 / 5; border-radius: 7px; overflow: hidden; background: #151a21; box-shadow: inset 0 0 0 1px rgba(0,0,0,.6); }
.card .art img { display: block; width: 100%; height: 100%; object-fit: contain; }
.card .art::after { content: ''; position: absolute; inset: 0; border-radius: 7px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), inset 0 0 14px rgba(0,0,0,.35); pointer-events: none; }
.card .rank { position: absolute; top: 5px; left: 5px; z-index: 1; min-width: 34px; padding: 4px 6px 3px; border-radius: 6px; text-align: center; background: rgba(233,226,208,.94); color: var(--ink); font: 700 20px/1 var(--mono); box-shadow: 0 1px 3px rgba(0,0,0,.5); }
.card .rank small { font-size: 15px; margin-left: 1px; }
.card.weapon .rank { color: #2e5f93; } .card.potion .rank { color: #a3323a; } .card.elite .rank { background: #e7c66e; }
.card .name { display: grid; gap: 1px; text-align: center; }
.card .face { font: 400 16px/1.15 var(--display); }
.card .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; color: #6b5f4e; }
.card.weapon .kind { color: #2e5f93; } .card.potion .kind { color: #a3323a; } .card.elite .kind { color: #8a5f0c; }
.card .acts { margin-top: auto; }

/* contracts: offers on parchment with wax seals, the signed contract on paper */
.offers { grid-template-columns: repeat(auto-fit, minmax(140px, 170px)); justify-content: center; gap: 14px; }
.offer, .offer.clause { position: relative; background: url(assets/ui/contract-parchment.webp) center / 100% 100% no-repeat; border: 0; border-radius: 0; color: var(--paper-ink); padding: 20px 15% 34px; min-height: 220px; justify-items: center; align-content: start; text-align: center; gap: 3px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); transition: transform .15s; }
.offer:hover:not(:disabled) { transform: translateY(-3px) rotate(-.6deg); }
.offer:focus-visible { outline: 2px solid var(--verdigris); outline-offset: 3px; }
.offer.lit { border-radius: 6px; }
.offer .seal { width: 56px; height: 56px; margin-bottom: 2px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.offer .tier { font: 400 20px var(--display); }
.offer .muted { color: var(--paper-muted); }
.offer .price { color: var(--paper-gold); font-weight: 700; }
.offer .cl { color: var(--paper-red); margin-top: 6px; }
.offer .rule { font-size: 13px; }
.contract.paper { position: relative; background: #e3d8bd url(assets/ui/texture-parchment.webp) 0 0 / 320px; color: var(--paper-ink); border: 1px solid #8b7a5a; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
.contract.paper .price { color: var(--paper-gold); font-weight: 700; }
.contract.paper .muted, .paper .lh { color: var(--paper-muted); }
.paper .lh b { color: var(--paper-ink); }
.paper .lh.warn, .paper .lh.warn b { color: var(--paper-red); }
.contract.paper .cline { color: var(--paper-red); }
.contract.paper .progress { background: rgba(60,45,25,.18); box-shadow: inset 0 1px 2px rgba(0,0,0,.25); }
.contract.paper .progress i { background: #2f6f5f; }
.contract.paper .progress.met i { background: #b8892a; }
.contract.paper .pip { border-color: #9c8a6a; }
.contract.paper .pip.room.on { background: #2f6f5f; border-color: #2f6f5f; }
.seals { display: inline-flex; gap: 4px; align-items: center; }
.seals img { width: 40px; height: 40px; }
.contract.paper h2 { display: flex; align-items: center; gap: 8px; }

/* stamps: ink marks from the art, the word set in type */
.stamp { position: absolute; z-index: 2; width: 132px; aspect-ratio: 512 / 232; display: grid; place-items: center; pointer-events: none; opacity: .92; }
.stamp.fresh { animation: stampin .35s cubic-bezier(.2,1.5,.4,1) both; }
.stamp img { position: absolute; inset: 0; width: 100%; height: 100%; }
.stamp b { position: relative; font: 700 20px/1 var(--mono); letter-spacing: .14em; transform: rotate(-8deg); }
.stamp.paid b { color: #2f8f3e; } .stamp.strike b { color: #c8312f; } .stamp.raised b { color: #c8901a; }
.contract.paper .stamp { left: 50%; margin-left: -60px; top: 2px; width: 120px; }
@media (max-width: 560px) { .contract.paper .stamp { left: auto; right: 8px; margin: 0; top: -16px; width: 104px; } .contract.paper .stamp b { font-size: 16px; } }
@keyframes stampin { from { transform: scale(1.8); opacity: 0; } to { transform: none; opacity: .92; } }

/* people: bosses, the guild clerk */
.boss { background: var(--panel-bg); border: 1px solid rgba(208,84,91,.6); align-items: center; flex-wrap: nowrap; gap: 12px; }
.boss img, .clerk { width: 64px; height: 80px; border-radius: 6px; flex: none; object-fit: contain; box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.5); }
.boss .who { display: grid; gap: 2px; }
.boss .who .label { color: var(--blood); }
.coach { grid-template-columns: auto 1fr; column-gap: 14px; align-items: start; }
.coach > .clerk { grid-row: span 3; width: 84px; height: 105px; }
.status.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.status.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 620px) { .status.n3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .status.n2 .stat:first-child { grid-column: auto; } }
/* What the clerk is talking about right now. */
.tut-focus { position: relative; z-index: 2; outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 8px; box-shadow: 0 0 0 7px color-mix(in srgb, var(--gold) 28%, transparent); animation: focuspulse 1.3s ease-in-out infinite; }
.status .tut-focus { outline-offset: -3px; border-radius: 0; box-shadow: inset 0 0 0 999px color-mix(in srgb, var(--gold) 14%, transparent); }
@keyframes focuspulse { 50% { outline-color: color-mix(in srgb, var(--gold) 40%, transparent); } }
.pip.tut-focus { margin: 0 4px; border-radius: 50%; outline-offset: 2px; box-shadow: 0 0 10px 4px color-mix(in srgb, var(--gold) 55%, transparent); }
@media (prefers-reduced-motion: reduce) { .tut-focus, .card.lit, .offer.lit { animation: none; } }
.coach .tutnav { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
/* The clerk's dialogue is the one thing a new player must read, so it is big and bright. */
.coach { border: 2px solid var(--verdigris); box-shadow: 0 0 0 4px color-mix(in srgb, var(--verdigris) 20%, transparent), 0 6px 18px rgba(0,0,0,.35); padding: 16px 18px; row-gap: 10px; }
.coach p { font-size: 21px; line-height: 1.35; color: var(--bone); }
.coach .label { font-size: 13px; color: var(--verdigris); }
.coach.hint { border-color: var(--gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 18%, transparent), 0 6px 18px rgba(0,0,0,.35); }
.coach.hint .label { color: var(--gold); }
.coach .ok { font-size: 17px; padding: 10px 22px; }
@media (max-width: 560px) { .coach > .clerk { width: 60px; height: 75px; } .coach p { font-size: 19px; } }
.coach > :not(.clerk) { grid-column: 2; }
.settle { position: relative; display: flex; gap: 14px; align-items: center; background: var(--panel-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.settle .clerk { width: 72px; height: 90px; }
.settle .say { display: grid; gap: 4px; min-width: 0; }
.settle .stamp { right: 12px; top: -16px; }
.settle p { margin: 0; font-size: 17px; }
.settle.stamped p { padding-top: 14px; }
.end { position: relative; background: var(--panel-bg); }
.endsum, .endform { display: grid; gap: 12px; justify-items: center; min-width: 0; }
.endform > input, .endform > textarea { width: min(100%, 480px); }

/* The act map: the act's three floors side by side, boss last, like a road you walk left to right. */

<script>/*ENGINE*/</script>

<script>
const E = window.Engine;
// Semantic version: MAJOR = overhaul or redesign, MINOR = update, PATCH = bug fix. Bump it in every change and add a CHANGELOG.md entry.
// Runs from before versioning carry the old tags 'v3' (first public playtest) and 'v4'.
const VERSION = '1.18.0';
// Web build only: where run reports go (a Google Form). Empty in the Claude-hosted build.
const REPORT = { url: '', entry: '' }; /*REPORT_CONFIG*/
const BOARD_CSV = ''; /*BOARD_CONFIG*/ // the Sheet's published Leaderboard tab; empty hides the board
const webReports = () => !!(REPORT.url && REPORT.entry) && dbState !== 'on';
const app = document.getElementById('app');
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// A hold / hover tip (see "hold / hover tips" below). The text may hold <b>; it is always the game's own wording.
const tipAttr = (title, text) => ` data-tip-title="${esc(title)}" data-tip="${esc(text)}"`;
// Card names match the card art: spades are the undead, clubs the beasts and goblinkin.
const monsterNames = {
  '♠': { 2: 'Rats', 3: 'Bone Spider', 4: 'Zombie', 5: 'Ghost', 6: 'Skeleton Warrior', 7: 'Ghoul', 8: 'Wraith', 9: 'Mummy', 10: 'Bone Golem', 11: 'Jailer', 12: 'Banshee Matriarch', 13: 'Skeleton King', 14: 'Vampire Lord' },
  '♣': { 2: 'Goblin Scavenger', 3: 'Cave Bat', 4: 'Kobold Trapper', 5: 'Dire Wolf', 6: 'Hobgoblin', 7: 'Centipede', 8: 'Bugbear', 9: 'Owlbear', 10: 'Cave Troll', 11: 'Orc Warden', 12: 'Spider Broodmother', 13: 'Goblin King', 14: 'Forest Wyrm' },
  '★': { 15: 'Dungeon Horror', 17: 'Dread Dragon' },
};
const weaponNames = { 2: 'Kitchen Knife', 3: 'Club', 4: 'Dagger', 5: 'Hand Axe', 6: 'Mace', 7: 'Short Sword', 8: 'War Hammer', 9: 'Longsword', 10: 'Runed Greatsword' };

// ---------- art (files in assets/, made by src/import_art.py) ----------
const ART = 'assets/';
const img = (path, cls = '', alt = '') => `<img src="${ART}${path}" alt="${alt}"${cls ? ` class="${cls}"` : ''} decoding="async">`;
const potionSize = v => v >= 8 ? 'large' : v >= 5 ? 'medium' : 'small';
function cardArt(c) {
  if (c.kind === 'monster') return c.suit === '★' ? `cards/elite-${c.v}.webp` : `cards/${c.suit === '♠' ? 'spades' : 'clubs'}-${c.v}.webp`;
  if (c.kind === 'weapon') return `cards/weapon-${Math.max(2, Math.min(10, c.v))}.webp`;
  return `cards/potion-${potionSize(c.v)}.webp`;
}
const iconOf = k => E.RELICS[k] ? `icons/relic-${k === 'keenedge' ? 'keen-edge' : k}.webp` : `icons/service-${k}.webp`;
const tierSeal = t => `ui/seal-tier-${['safe', 'bold', 'reckless'][t]}.webp`;
const clauseSeal = k => `ui/seal-clause-${({ sworn: 'sworn', abstain: 'abstinent', steel: 'steel-oath', bare: 'bare-oath' })[k]}.webp`;
const bossArt = { fleeToll: 'boss-warden', halfPotion: 'boss-plague-hag', recklessOnly: 'boss-lich-auditor' };
const clerk = (mood, cls = 'clerk') => img(`portraits/clerk-${mood}.webp`, cls, 'The guild clerk');
// A stamp slams down once; later renders of the same stamp sit still.
const stamped = new Set();
const stamp = (kind, key) => {
  const fresh = !stamped.has(key); stamped.add(key);
  return `<span class="stamp ${kind} ${fresh ? 'fresh' : ''}">${img(`ui/stamp-${kind}.webp`)}<b>${kind.toUpperCase()}</b></span>`;
};
function scene() {
  if (mapView) return ACTS[mapAct()].scene;
  if (s.phase === 'bid') return 'contract-board';
  if (s.phase === 'room') return ['act1-crypt', 'act2-sewers', 'act3-vault'][Math.min(2, E.act(s))];
  if (s.phase === 'shop') return 'guild-hall';
  if (s.phase === 'tutdone') return 'title';
  return s.phase === 'won' ? 'victory' : 'defeat';
}
let shownScene = '';
function setScene() {
  const sc = scene(); if (sc === shownScene) return;
  shownScene = sc;
  const el = document.getElementById('scene');
  el.style.backgroundImage = `url(${ART}backgrounds/${sc}.webp)`;
  el.classList.toggle('dim', sc === 'act2-sewers'); // the sewer art is busy behind cards
  el.classList.toggle('dead', sc === 'defeat');
}
// Effects: a one-shot sprite over a spot on screen. Skipped for reduced motion.
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function fx(name, rect) {
  const layer = document.getElementById('fx');
  if (reduceMotion || !rect || !layer || !rect.width) return;
  const size = Math.round(Math.min(200, Math.max(96, rect.width * 0.9)));
  const el = document.createElement('img');
  el.src = `${ART}fx/${name}.webp`; el.alt = ''; el.className = 'fx-' + name;
  el.style.cssText = `left:${rect.left + rect.width / 2 - size / 2}px;top:${rect.top + rect.height / 2 - size / 2}px;width:${size}px;height:${size}px`;
  el.addEventListener('animationend', () => el.remove());
  layer.appendChild(el); setTimeout(() => el.remove(), 2000);
}
const rectOf = sel => { const el = document.querySelector(sel); return el && el.getBoundingClientRect(); };

// ---------- per-viewer conveniences (browser storage; may be unavailable) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('gl-' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('gl-' + k, JSON.stringify(v)); } catch {} },
};
let seenHints = store.get('hints', {});

// ---------- tutorial ----------
// Each step allows exactly one action, so the coach text always matches the table.
// Steps with `allow` wait for that one move. Steps without it are a tour of the screen with a Next button.
// `focus` highlights the part of the screen the step talks about.
const TUTORIAL = [
  { focus: '.stat.hp', text: 'This is your <b>health</b>. If it reaches 0, you lose. Your only goal is to <b>stay alive</b>.' },
  { focus: '.stat.weapon', text: 'This is your <b>weapon</b>. A weapon blocks damage from monsters. You don\'t have one yet.' },
  { focus: '.chamber', text: 'This is a <b>room</b>. Each room is dealt 4 cards from the pile. You pick 3 of them, and the last one stays for the next room.' },
  { focus: '.chamber-title h2', text: 'This counts the <b>rooms</b> you get through. Get through 2 rooms to finish training.' },
  { allow: { v: 7, mode: null }, text: 'Let\'s play. Pick up the <b>Short Sword</b>.' },
  { allow: { v: 9, mode: 'weapon' }, focus: '.stat.weapon', text: 'Every card has a number. A monster\'s number is how much <b>health it takes</b>. The <b>Owlbear</b> is a 9, so it hits for 9. Your sword is a 7, so it blocks 7. You only lose <b>2</b>. Fight it with your sword.' },
  { allow: { v: 5, mode: 'weapon' }, focus: '.stat.weapon', text: 'Each fight wears your sword down. Now it can only fight monsters up to <b>9</b>, the size of the last one it beat. The <b>Ghost</b> is a 5, so your sword still works. Fight it.' },
  { allow: { flee: true }, focus: '[data-flee]', text: 'New room! These monsters are all <b>too big</b> for your sword. Fighting them would cost most of your health. Tap <b>Flee room</b> to run away.' },
  { focus: '.chamber-title h2', text: 'You got away! The monsters went to the bottom of the pile. Fleeing <b>doesn\'t count</b> as a room, so this is still room 2.' },
  { focus: '.chamber', text: 'You can flee at the start of <b>any room</b>. The only rule is you <b>can\'t flee 2 rooms in a row</b>, so you have to face this one.' },
  { allow: { v: 3, mode: 'weapon' }, focus: '.stat.weapon', text: 'The <b>Cave Bat</b> is a 3. That\'s under 5, so your sword can fight it. Hit it with your sword.' },
  { allow: { v: 10, mode: 'bare' }, focus: '.stat.hp', text: 'The <b>Bone Golem</b> is a 10. That\'s too big for your sword now, so you fight with your fists and lose the full <b>10</b> health.' },
  { allow: { v: 6, mode: null }, focus: '.stat.hp', text: 'Ouch! The <b>Tonic</b> is a 6, so it gives back 6 health. Drink it.' },
];
let tut = null; // { step } while the tutorial runs

// ---------- game state and playtest record ----------
let s;
let rec = null;
function newRec() {
  return {
    id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), version: VERSION,
    startedAt: new Date().toISOString(), endedAt: null, status: 'in_progress', outcome: null,
    floorReached: 1, totalSlain: 0, gold: 0, strikes: 0, relics: [], floors: [], shops: [], actions: 0, note: '',
  };
}
// 'guided' starts with only health, weapons and potions and unlocks the rest floor by floor; 'full' has everything from floor 1.
const gameMode = () => store.get('mode', 'guided') === 'full' ? 'full' : 'guided';
function startRun() { tut = null; lastHit = null; s = E.newGame(undefined, { guided: gameMode() === 'guided' }); rec = newRec(); rec.mode = gameMode(); store.set('tutorial', true); noteSurvivalFloor(); mapView = 'auto'; }
function noteSurvivalFloor() { // a floor with no contract starts without a bid, so record it here
  if (!rec || s.phase !== 'room' || !s.contract || !s.contract.survival) return;
  const f = rec.floors[rec.floors.length - 1];
  if (f && f.floor === s.floor + 1) return;
  rec.floors.push({ floor: s.floor + 1, tier: null, survival: true, clause: null, target: 0, boss: s.boss ? s.boss.key : null, hpStart: s.hp, goldStart: s.gold, raises: 0, flees: 0 });
}
function startTutorial() { readReportForm(); if (rec && rec.status === 'in_progress' && rec.floors.length) { rec.status = 'abandoned'; save(); } sendReport(rec); s = E.newTutorial(); rec = null; tut = { step: 0 }; mapView = 'auto'; }

// ---------- shared playtest log (db capability) ----------
let db = null, uid = null, owner = false, myDoc = null, saving = Promise.resolve(), dbState = 'connecting';
(async () => {
  try {
    const user = await window.claude?.use?.('user');
    db = await window.claude?.use?.('db');
    if (!db || !user) { dbState = 'off'; render(); return; }
    uid = await user.id();
    owner = await user.isOwner();
    if (!uid) { dbState = 'off'; render(); return; }
    if (!owner && (await user.can('data.write')) === false) { dbState = 'readonly'; render(); return; }
    const snap = await db.doc('playtests/' + uid).get();
    myDoc = snap.exists ? { ...snap.data() } : { runs: [] };
    myDoc.runs = Array.isArray(myDoc.runs) ? myDoc.runs.slice() : [];
    dbState = 'on';
  } catch { dbState = 'off'; }
  render();
})();
function save() {
  if (dbState !== 'on' || !rec) return;
  const snapshot = JSON.parse(JSON.stringify(rec));
  saving = saving.then(async () => {
    const runs = myDoc.runs.filter(r => r.id !== snapshot.id);
    runs.push(snapshot);
    myDoc = { runs: runs.slice(-100), tutorialDone: !!store.get('tutorial', false), updatedAt: new Date().toISOString() };
    try { await db.doc('playtests/' + uid).set(myDoc); }
    catch (e) { if (e && e.code === 'invalid_argument') { dbState = 'readonly'; render(); } }
  });
  return saving;
}

// ---------- recording hooks ----------
// A death ends the floor early, so its points aren't in totalSlain yet. Win and strike-out already counted them.
const runPoints = () => s.totalSlain + (s.phase === 'lost' && s.hp === 0 ? s.slain : 0);
const curFloor = () => rec && rec.floors[rec.floors.length - 1];
function afterAction(prevPhase) {
  if (!rec) return;
  rec.actions++;
  noteSurvivalFloor();
  const f = curFloor();
  if (prevPhase === 'room' && s.phase !== 'room' && f) { // floor or run just ended
    f.slain = s.slain;
    f.met = f.slain >= f.target; f.hpEnd = s.hp; f.died = s.hp === 0;
    rec.totalSlain = runPoints();
  }
  if (s.phase === 'shop' && prevPhase !== 'shop') rec.shops.push({ floor: s.floor + 1, offered: s.shop.relics.slice(), bought: [], goldIn: s.gold });
  rec.floorReached = s.floor + 1; rec.gold = s.gold; rec.strikes = s.strikes; rec.relics = s.relics.slice();

    rec.status = 'finished'; rec.outcome = s.phase === 'won' ? 'won' : s.hp === 0 ? 'died' : 'struck_out';

  if (prevPhase !== s.phase || s.phase === 'won' || s.phase === 'lost') save();
}

function currentHint() {
  if (tut) return null;
  const multi = s.offers && s.offers.length > 1;
  const shopNow = s.phase === 'shop';

function dealIn() {
  const els = [...app.querySelectorAll('.chamber .card[data-card]')];
  const pile = app.querySelector('.chamber .pile');
  const now = performance.now();
  if (pile && !reduceMotion) {
    const p = pile.getBoundingClientRect();
    let n = 0;
    els.forEach(el => {
      const id = +el.dataset.card;
      if (!shownRoom.has(id)) dealing.set(id, now + 130 * n++);
      const t0 = dealing.get(id);
      if (t0 == null || now > t0 + DEAL_MS) return;
      const r = el.getBoundingClientRect(), delay = t0 - now; // negative when resuming mid-flight
      const dx = p.left + p.width / 2 - (r.left + r.width / 2), dy = p.top + p.height / 2 - (r.top + r.height / 2);
      el.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${p.width / r.width}) rotate(-10deg)` }, { transform: 'none' }],
        { duration: 450, delay, easing: 'cubic-bezier(.2,.75,.25,1)', fill: 'backwards' });

// ---------- leaderboard (top scores from the Sheet's published Leaderboard tab) ----------
// The tab has one row per reported run: mode, name, points, floor, outcome, gold, version, date.
// Google refreshes a published CSV about every 5 minutes, so a new score can take that long to show.
const BOARD_MAX_POINTS = E.FLOORS * E.ROOMS_PER_FLOOR * 3 * 17; // every card handled being the biggest monster: anything above is fake
let board = null, boardState = BOARD_CSV ? 'idle' : 'off', boardMode = null, boardAt = 0;
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
// Keeps plausible runs, then each named player's best run per mode, highest points first (more gold breaks ties).
function boardFromCSV(text) {
  const [head, ...rows] = parseCSV(text.trim());
  const col = k => head.findIndex(h => h.trim().toLowerCase() === k);
  const at = { mode: col('mode'), name: col('name'), points: col('points'), floor: col('floor'), outcome: col('outcome'), gold: col('gold') };
  if (Object.values(at).some(i => i < 0)) throw new Error('unexpected columns');
  const out = { guided: [], full: [] }, best = {};
  for (const r of rows) {
    const e = { mode: r[at.mode], name: (r[at.name] || '').trim().slice(0, 40), points: +r[at.points], floor: +r[at.floor], outcome: r[at.outcome], gold: +r[at.gold] || 0 };
    if (!out[e.mode] || !Number.isInteger(e.points) || e.points < 0 || e.points > BOARD_MAX_POINTS || !(e.floor >= 1 && e.floor <= E.FLOORS)) continue;
    const better = (a, b) => a.points - b.points || a.gold - b.gold;
    if (e.name) {
      const k = e.mode + '|' + e.name.toLowerCase();
      if (best[k] && better(best[k], e) >= 0) continue;
      if (best[k]) out[e.mode].splice(out[e.mode].indexOf(best[k]), 1);
      best[k] = e;
    }
    out[e.mode].push(e);
  }
  for (const m in out) out[m] = out[m].sort((a, b) => -((a.points - b.points) || (a.gold - b.gold))).slice(0, 10);
  return out;
}

      <div class="buyrow"><span class="tag ${short && !sold ? 'short' : ''}">${img('icons/hud-gold.webp')}<span class="num">${item.cost}</span></span>
      <button data-buy="${k}" ${sold || short || (E.RELICS[k] && full) ? 'disabled' : ''}>${sold ? 'Sold' : 'Buy'}</button></div></div>`;
    };
    body = cols(`${coachHTML()}${statusHTML()}${settleHTML()}`, `
      <section class="shop"><div class="shopsign"><h2>Guild Shop</h2><span class="purse">${img('icons/hud-gold.webp')}<b class="num">${s.gold}</b> gold</span></div>
        ${relicsOpen() ? `<div class="shelf"><div class="label">Relics${full ? ' · slots full' : ''}</div>
        <div class="shopgrid relicgrid">${s.shop.relics.map(k => ware(k, E.RELICS[k])).join('') || '<p class="muted">Sold out.</p>'}</div></div>` : ''}
        <div class="shelf"><div class="label">Services</div>
        <div class="shopgrid services">${Object.entries(E.SERVICES).map(([k, v]) => ware(k, v)).join('')}</div></div>
        ${duesWarning()}${relicsOpen() ? `<div class="label yours">Your relics (${s.relics.length}/${E.MAX_RELICS})</div>` : ''}
        <div class="shopexit">${relicsOpen() ? relicsHTML(true) : ''}<button class="primary" data-leave>Leave shop</button></div>
      </section>`, `${rulesHTML()}${boardHTML()}${statsHTML()}`);
  } else if (s.phase === 'tutdone') {
    body = tutDoneHTML();
  } else {
    body = endHTML() + boardHTML(!narrow() && innerHeight > 820) + logHTML() + statsHTML();
  }
  const framed = body.startsWith('<div class="cols">');
  app.className = (framed ? 'play' : 'solo') + (moreOpen && framed ? ' more-open' : '') + (mapView ? ' map' : '');
  const endForm = (s.phase === 'won' || s.phase === 'lost') && webReports() && rec; // its own note already says the report is sent
  app.innerHTML = head + body + (framed ? '' : (endForm ? '' : syncNote()) + `<p class="muted version">v${VERSION}</p>`) + (paused && !mapView ? pauseHTML() : '');
  if (paused && !mapView) { // only the menu takes clicks and focus while paused
    app.querySelectorAll(':scope > :not(.overlay)').forEach(el => { el.inert = true; });
    app.querySelector('.overlay [data-resume]').focus();
  }
  dealIn();
  if ((s.phase === 'won' || s.phase === 'lost') && boardState !== 'off' && boardState !== 'loading' && Date.now() - boardAt > 60000) { boardMode = null; loadBoard(); } // fresh scores on the end screen
  const focus = tut ? TUTORIAL[tut.step] && TUTORIAL[tut.step].focus : (currentHint() || {}).focus;
  if (focus && s.phase !== 'tutdone') app.querySelectorAll(focus).forEach(el => el.classList.add('tut-focus'));
  showClerk();
}
// When the clerk says something new and it's out of view (mostly on phones), scroll up to it.
let lastClerkLine = null;
function showClerk() {
  const el = app.querySelector('.coach, .settle');
  const line = el ? el.textContent : null;
  if (!el || line === lastClerkLine) { lastClerkLine = line; return; }
  lastClerkLine = line;
  const r = el.getBoundingClientRect(), side = el.closest('.side');
  const hidden = r.top < 0 || r.bottom > innerHeight || (side && el.offsetTop - side.offsetTop < side.scrollTop);
  if (hidden) el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
}

// ---------- health preview ----------
// Pointing at (or pressing) a card's button shows what it would do to your health: the lost part of the bar
// flashes red, healing shows in green, and the number shows where you'd end up.
function hpChange(b) {
  const c = s && s.phase === 'room' && s.room.find(x => x.id === +b.dataset.id);
  if (!c) return 0;
  if (c.kind === 'monster') return -E.monsterDamage(s, c, b.dataset.act === 'weapon');
  if (c.kind === 'potion') return Math.min(E.potionHeal(s, c), s.maxHp - s.hp);
  return 0;
}
function previewHP(b) {
  clearPreview();
  const delta = b ? hpChange(b) : 0, cell = app.querySelector('.stat.hp');
  if (!delta || !cell) return;
  const after = Math.max(0, Math.min(s.maxHp, s.hp + delta)), pct = v => 100 * v / s.maxHp;
  const bar = cell.querySelector('.hpbar'), num = cell.querySelector('.num');
  const seg = document.createElement('b'); seg.className = 'preview ' + (delta < 0 ? 'loss' : 'gain');
  const lo = Math.min(after, s.hp), hi = Math.max(after, s.hp);
  seg.style.left = pct(lo) + '%'; seg.style.width = pct(hi - lo) + '%';
  if (delta < 0) bar.querySelector('i').style.width = pct(after) + '%';
  bar.appendChild(seg);
  const tag = document.createElement('span');
  tag.className = 'after preview ' + (after === 0 ? 'dead' : delta < 0 ? 'down' : 'up');
  tag.textContent = after === 0 ? '→ 0 ☠' : `→ ${after}`;
  num.appendChild(tag);
}
function clearPreview() {
  app.querySelectorAll('.stat.hp .preview').forEach(el => el.remove());
  const i = app.querySelector('.stat.hp .hpbar i'); if (i && s) i.style.width = 100 * s.hp / s.maxHp + '%';
}
const actBtn = e => e.target.closest && e.target.closest('button[data-act]:not(:disabled)');
app.addEventListener('pointerover', e => { const b = actBtn(e); if (b) previewHP(b); });
app.addEventListener('pointerout', e => { const b = actBtn(e); if (b && !b.contains(e.relatedTarget)) clearPreview(); });
app.addEventListener('pointerdown', e => { const b = actBtn(e); if (b) previewHP(b); });
app.addEventListener('focusin', e => { const b = actBtn(e); if (b) previewHP(b); });
app.addEventListener('focusout', e => { if (actBtn(e)) clearPreview(); });

// ---------- hold / hover tips ----------
// Details that don't need to sit on screen (what a relic does, a Wildcard's rule, what a raise pays) show in a small
// tip: point at it with a mouse, focus it with the keyboard, or press and hold on a touch screen. A hold never counts
// as a tap, so holding a card's button or a contract reads it without playing it.
const tipEl = document.createElement('div'); tipEl.id = 'tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl);
let tipFor = null, holdTimer = 0, holdAt = null, swallowUntil = 0;
function showTip(el) {
  tipFor = el;
  tipEl.innerHTML = `${el.dataset.tipTitle ? `<b>${esc(el.dataset.tipTitle)}</b>` : ''}<span>${el.dataset.tip}</span>`; // tips are the game's own text
  tipEl.classList.add('on');
  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  const left = Math.max(8, Math.min(innerWidth - t.width - 8, r.left + r.width / 2 - t.width / 2));
  let top = r.top - t.height - 10;
  if (top < 8) top = Math.min(innerHeight - t.height - 8, r.bottom + 10);
  tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
}
function hideTip() { tipFor = null; tipEl.classList.remove('on'); }
const tipTarget = e => e.target && e.target.closest && e.target.closest('[data-tip]');
document.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const el = tipTarget(e);
  if (el && el !== tipFor) showTip(el); else if (!el && tipFor) hideTip();
});
document.addEventListener('pointerout', e => { if (e.pointerType === 'mouse' && !e.relatedTarget) hideTip(); });
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  clearTimeout(holdTimer); hideTip();
  const el = tipTarget(e); if (!el) return;
  holdAt = { x: e.clientX, y: e.clientY };
  holdTimer = setTimeout(() => { holdAt = null; showTip(el); swallowUntil = Infinity; }, 380);
});
document.addEventListener('pointermove', e => { if (holdAt && Math.hypot(e.clientX - holdAt.x, e.clientY - holdAt.y) > 10) { clearTimeout(holdTimer); holdAt = null; } });
const endHold = () => { clearTimeout(holdTimer); holdAt = null; if (swallowUntil === Infinity) swallowUntil = Date.now() + 500; };
document.addEventListener('pointerup', endHold); document.addEventListener('pointercancel', endHold);
document.addEventListener('click', e => { if (Date.now() < swallowUntil) { e.preventDefault(); e.stopPropagation(); swallowUntil = 0; } }, true);
document.addEventListener('contextmenu', e => { if (tipTarget(e) && (e.pointerType || 'touch') !== 'mouse') e.preventDefault(); });
document.addEventListener('focusin', e => { const el = tipTarget(e); if (el && e.target.matches(':focus-visible')) showTip(el); });
document.addEventListener('focusout', () => { if (tipFor) hideTip(); });
window.addEventListener('scroll', () => { if (tipFor) hideTip(); }, true);

// ---------- owner stats ----------
async function loadStats() {
  const el = document.getElementById('statsbody'); if (!el) return;
  el.innerHTML = '<p class="muted">Loading…</p>';
  let docs;
  try { docs = (await db.collection('playtests').get()).docs.map(d => d.data()); }
  catch { el.innerHTML = '<p class="muted">Couldn\'t load the playtest log. Try again in a moment.</p>'; return; }
  const runs = docs.flatMap(d => Array.isArray(d.runs) ? d.runs : []);
  const done = runs.filter(r => r.status === 'finished');
  if (!runs.length) { el.innerHTML = '<p class="muted">No runs recorded yet. Share the game with playtesters at Contributor level, and their runs will show up here.</p>'; return; }
  const pctOf = (n, d) => d ? Math.round(100 * n / d) + '%' : '–';
  const ends = Array(9).fill(0); done.forEach(r => { if (r.outcome !== 'won') ends[Math.min(8, r.floorReached - 1)]++; });
  const floors = runs.flatMap(r => r.floors || []);
  const tiers = [0, 1, 2].map(t => floors.filter(f => f.tier === t));
  const offered = {}, bought = {};
  runs.forEach(r => (r.shops || []).forEach(sh => { sh.offered.forEach(k => offered[k] = (offered[k] || 0) + 1); sh.bought.forEach(k => bought[k] = (bought[k] || 0) + 1); }));
  const picks = Object.keys(offered).filter(k => E.RELICS[k] && offered[k] >= 2).map(k => ({ k, rate: (bought[k] || 0) / offered[k], n: offered[k] })).sort((a, b) => b.rate - a.rate);
  const notes = runs.filter(r => r.note).slice(-8).reverse();
  el.innerHTML = `
    <p><b class="num">${docs.length}</b> player${docs.length === 1 ? '' : 's'} · <b class="num">${runs.length}</b> run${runs.length === 1 ? '' : 's'} (${done.length} finished, ${runs.filter(r => r.status === 'abandoned').length} abandoned, the rest unfinished) · ${docs.filter(d => d.tutorialDone).length} finished the training</p>
    <p>Finished runs: won <b>${pctOf(done.filter(r => r.outcome === 'won').length, done.length)}</b>, died <b>${pctOf(done.filter(r => r.outcome === 'died').length, done.length)}</b>, struck out <b>${pctOf(done.filter(r => r.outcome === 'struck_out').length, done.length)}</b></p>
    <p>Runs lost on floors 1–9: <span class="num">${ends.join(' · ')}</span></p>
    <p>Contracts: ${tiers.map((f, t) => `${E.TIERS[t]} ${f.length} signed, ${pctOf(f.filter(x => x.met).length, f.filter(x => x.met !== undefined).length)} met`).join(' · ')}. Raises: ${floors.reduce((a, f) => a + (f.raises || 0), 0)}. Flees: ${floors.reduce((a, f) => a + (f.flees || 0), 0)}.</p>
    ${picks.length ? `<p>Relic pick rate (bought when offered): most picked ${picks.slice(0, 4).map(p => `${E.RELICS[p.k].name} ${pctOf(p.rate, 1)}`).join(', ')}; least picked ${picks.slice(-4).reverse().map(p => `${E.RELICS[p.k].name} ${pctOf(p.rate, 1)}`).join(', ')}.</p>` : ''}
    ${notes.length ? `<div class="label">Latest notes</div><ul class="recap">${notes.map(r => `<li>${esc(r.note)} <span class="muted">(${({ won: 'won', died: 'died', struck_out: 'struck out', abandoned: 'abandoned', in_progress: 'unfinished' })[r.outcome || r.status]}, floor ${r.floorReached})</span></li>`).join('')}</ul>` : ''}
    <button data-stats>Refresh</button>`;
}

// ---------- input ----------
let busy = false; // true while a card's leave animation plays
app.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || b.disabled || busy) return;
  if (titleOn) {
    const d = b.dataset;
    if (d.mode) { store.set('mode', d.mode); boardMode = null; render(); }
    else if (d.board) { boardMode = d.board; paintBoards(); }
    else if ('play' in d) { titleOn = false; s = E.newTutorial(); tut = { step: 0 }; mapView = 'auto'; render(); }
    return;
  }
  const d = b.dataset, prev = s.phase, hintBefore = shownHint;
  if ('more' in d) { moreOpen = !moreOpen; render(); return; }
  if ('pause' in d) { paused = true; moreOpen = false; render(); return; }
  if ('resume' in d) { paused = false; render(); return; }
  if ('map' in d) { mapView = 'pause'; render(); return; }
  if ('mapback' in d) { mapView = null; render(); return; } // back to the pause menu
  if ('mapgo' in d) { mapView = null; paused = false; render(); return; }
  if (moreOpen && !e.target.closest('.extras')) moreOpen = false;
  let acted = true, effect = null;
  const cardEl = b.closest('.card');
  if (d.bid !== undefined) {
    if (!E.bid(s, +d.bid)) return;
    if (rec) rec.floors.push({ floor: s.floor + 1, tier: s.contract.tier, clause: s.contract.clause, target: s.contract.target, boss: s.boss ? s.boss.key : null, hpStart: s.hp, goldStart: s.gold, raises: 0, flees: 0 });
    if (rec && s.floor === 0) save();
    effect = () => fx('ink', rectOf('.contract.paper'));
  } else if (d.act) {
    // The effect plays on the card while it leaves the table, then the move resolves.
    const c = s.room.find(x => x.id === +d.id); if (!c) return;
    const name = c.kind === 'monster' ? (d.act === 'weapon' ? 'slash' : 'punch') : c.kind === 'potion' && E.potionHeal(s, c) > 0 && s.hp < s.maxHp ? 'heal' : null;
    if (cardEl && !reduceMotion) {
      busy = true; if (name) fx(name, cardEl.getBoundingClientRect()); cardEl.classList.add('leaving');
      await new Promise(r => setTimeout(r, 260)); busy = false;
    }
    if (c.kind === 'monster') { const w = d.act === 'weapon' && E.canUseWeapon(s, c); lastHit = { name: cardName(c), v: c.v, mode: w ? 'weapon' : 'bare', dmg: E.monsterDamage(s, c, w), card: { ...c } }; }
    if (!E.handle(s, +d.id, d.act === 'take' ? null : d.act)) { render(); return; }
  } else if ('flee' in d) {
    const at = rectOf('.room'), p = rectOf('.chamber .pile');
    if (p && !reduceMotion) {
      busy = true;
      app.querySelectorAll('.chamber .card').forEach((el, i) => {
        const r = el.getBoundingClientRect();
        el.animate([{ transform: 'none' }, { transform: `translate(${p.left + p.width / 2 - (r.left + r.width / 2)}px, ${p.top + p.height / 2 - (r.top + r.height / 2)}px) scale(${p.width / r.width})`, opacity: .3 }],
          { duration: 320, delay: 50 * i, easing: 'ease-in', fill: 'forwards' });
      });
      await new Promise(r => setTimeout(r, 480)); busy = false;
    }
    if (E.flee(s) && curFloor()) curFloor().flees++;
    effect = () => fx('smoke', at);
  }
  else if ('raise' in d) {
    if (E.raise(s) && curFloor()) { const f = curFloor(); f.raises++; f.target = s.contract.target; f.tier = s.contract.tier; f.raisedAtRoom = s.roomsCleared + 1; }
  }
  else if ('redraw' in d) E.redraw(s);
  else if (d.buy) {
    const at = b.closest('.ware') && b.closest('.ware').getBoundingClientRect();
    if (E.buy(s, d.buy)) { effect = () => fx('coins', at); if (rec && rec.shops.length) rec.shops[rec.shops.length - 1].bought.push(d.buy); }
  }
  else if (d.drop) E.dropRelic(s, d.drop);
  else if ('leave' in d) { E.leaveShop(s); mapView = 'auto'; }
  else if ('new' in d) {
    readReportForm();
    if (rec && rec.status === 'in_progress' && rec.floors.length) { rec.status = 'abandoned'; save(); }
    sendReport(rec);
    startRun(); acted = false;
  }
  else if ('title' in d) { // back to the title screen, where the game mode is picked
    const underway = rec && rec.status === 'in_progress' && (rec.floors.length > 1 || s.handled > 0 || s.roomsCleared > 0);
    if (underway && !confirm('Go back to the main menu? This run will end.')) return;
    readReportForm();
    if (underway) { rec.status = 'abandoned'; save(); } // an untouched run isn't worth a report
    if (underway || (rec && rec.status === 'finished')) sendReport(rec);
    rec = null; moreOpen = false; paused = false; mapView = null; titleOn = true; render(); return;
  }
  else if ('tutorial' in d) { startTutorial(); acted = false; }
  else if ('tutnext' in d) { if (tut) tut.step++; acted = false; }
  else if ('skiptut' in d) { store.set('tutorial', true); startRun(); acted = false; }
  else if ('fb' in d) {
    const t = document.getElementById('fb'); if (!t || !rec) return;
    rec.note = t.value.trim().slice(0, 600);
    b.disabled = true; await save();
    const st = document.getElementById('fbstate'); if (st) st.textContent = dbState === 'on' ? 'Saved. Thanks!' : 'Couldn\'t save.';
    b.disabled = false; return;
  }
  else if ('stats' in d) { loadStats(); return; }
  else if (d.board) { boardMode = d.board; paintBoards(); return; }
  else if ('copy' in d) {
    const t = document.getElementById('report'), st = document.getElementById('copystate');
    try { await navigator.clipboard.writeText(t.value); if (st) st.textContent = 'Copied.'; }
    catch { t.focus(); t.select(); if (st) st.textContent = 'Press Ctrl+C (or Cmd+C) to copy.'; }
    return;
  }
  else return;
  if (tut && acted) { tut.step++; if (s.phase === 'tutdone') store.set('tutorial', true); }
  if (acted) { afterAction(prev); if (!tut) retireHint(hintBefore); }
  if (prev === 'room' && s.phase === 'shop' && (s.lastResult || '').startsWith('Contract met')) {
    const last = effect; effect = () => { if (last) last(); fx('coins', rectOf('.status .stat:nth-child(2)')); };
  }
  render();
  if (effect) effect();
  if (prev === 'room' && s.phase === 'lost' && !reduceMotion) deathBlow(s.hp === 0);
});
// The run ends with a jolt: the screen shakes and flashes red, and the killing blow lands on the end screen.
function deathBlow(died) {
  const flash = document.createElement('div'); flash.className = 'deathflash'; document.body.appendChild(flash);
  flash.animate([{ opacity: died ? 1 : .6 }, { opacity: 0 }], { duration: 900, easing: 'ease-out' }).onfinish = () => flash.remove();
  app.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-9px,4px)' }, { transform: 'translate(8px,-5px)' }, { transform: 'translate(-6px,-3px)' }, { transform: 'translate(4px,3px)' }, { transform: 'none' }], { duration: 420, easing: 'ease-out' });
  if (!died) setTimeout(() => fx('ink', rectOf('.torn')), 300);
}

// Every visit opens on the title screen in Guided start. Play goes into the training floor, which players can skip.
store.set('mode', 'guided');
render();
</script>
<script>
// Guild Ledger: card warnings and status tooltips. A self-contained add-on loaded after the game's UI script.
// It wraps the global render() and decorates the DOM it produces; it never changes game state.
(function () {
  const css = document.createElement('style');
  css.textContent = `
.lh { font-size: 13px; line-height: 1.3; color: var(--ash); margin: 0; }
.lh b { color: var(--bone); font-weight: 600; }
.lh.warn, .lh.warn b { color: var(--gold); }
`;
  document.head.appendChild(css);

  const E = window.Engine;
  const has = k => s.relics.includes(k);
  const fleeToll = () => s.boss && s.boss.key === 'fleeToll';

  function fleeReason() {
    if (E.canFlee(s)) return fleeToll() ? 'The Warden charges 4 health to flee.' : 'Flee to send this room to the bottom of the pile.';
    if (s.contract && s.contract.clause === 'sworn') return 'Your Wildcard (Sworn) forbids fleeing.';
    if (s.handled > (has('scout') ? 1 : 0)) return 'You can only flee before touching a room.';
    if (fleeToll() && s.hp <= 4) return 'Too hurt to pay the Warden 4 health.';
    return "You can't flee two rooms in a row.";
  }
  const inTraining = () => typeof tut !== 'undefined' && tut;
  function decorate() {
    if (typeof s === 'undefined' || !s) return;
    const app = document.getElementById('app');
    const header = app.querySelector('header');
    const tips = { Health: 'Reach 0 and the run ends.', Gold: 'Earned on each floor. Pays for relics, services and dues.', Weapon: 'Softens monster hits. After a kill it can only hit monsters up to that size.', Strikes: 'Missed contracts and unpaid dues give a strike. 3 strikes ends the run. Dues are paid at the end of each act.' };
    const dues = E.DUES[E.act(s)];
    if (!inTraining()) tips.Strikes = `${s.strikes} of 3. A missed contract or unpaid dues is a strike, and 3 ends the run. Dues: <b>${dues}</b> gold after floor ${E.act(s) * 3 + 3}.`;
    app.querySelectorAll('.status .stat').forEach(el => { const k = Object.keys(tips).find(k => el.querySelector('.label').textContent.includes(k)); if (k) { el.dataset.tipTitle = k === 'Strikes' ? 'Strikes and dues' : k; el.dataset.tip = tips[k]; } });
    if (inTraining()) return;
    if (s.phase === 'room') { // a disabled button gets no pointer events in some browsers, so it keeps a plain title too
      const fb = app.querySelector('[data-flee]');
      if (fb) { fb.dataset.tipTitle = 'Flee room'; fb.dataset.tip = fleeReason(); fb.title = fb.disabled ? fleeReason() : ''; }
    }
  }

  const baseRender = render;
  render = function () { baseRender(); decorate(); };
  render();
})();
</script>
